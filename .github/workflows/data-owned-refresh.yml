name: FreePass Data source collection and delivery

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [shadow, execute, shared-sheet-dry-run, shared-sheet-apply]
        default: shadow
  schedule:
    - cron: '17 * * * *'
    # 공통 시트 데일리 박제(대표 «두 갈래»): 매일 03:40 KST. 같은 동시성 그룹이라 매시 배달과 겹치지 않는다.
    - cron: '40 18 * * *'

# Repository concurrency is NOT cross-repository locking. The adapter also
# requires the old writer disabled, drained and fenced at its IAM identity.
concurrency:
  group: freepass-data-production-delivery
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  refresh:
    if: >-
      github.event.schedule != '40 18 * * *' &&
      (github.event_name != 'workflow_dispatch' || !startsWith(inputs.mode, 'shared-sheet')) &&
      (vars.FREEPASS_DATA_REFRESH_OWNER == 'freepass-data' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'shadow'))
    environment: data-production-delivery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FREEPASS_DATA_REFRESH_OWNER: ${{ vars.FREEPASS_DATA_REFRESH_OWNER }}
      FREEPASS_DATA_LEGACY_FENCED_AT: ${{ vars.FREEPASS_DATA_LEGACY_FENCED_AT }}
      FREEPASS_DATA_REFRESH_EVIDENCE_BUCKET: ${{ vars.FREEPASS_DATA_REFRESH_EVIDENCE_BUCKET }}
      GOOGLE_CLOUD_PROJECT: freepasserp5
      FREEPASS_DATA_ENGINE_ROOT: ${{ github.workspace }}/engine
      FREEPASS_DATA_RECEIPT_PATH: ${{ github.workspace }}/tmp/data-delivery-receipt.json
      GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/engine/tmp/firebase-auth/sheets.json
      GOOGLE_SHEETS_SUBJECT: pyh@teamjpk.com
      # Fine-grained/App token: Actions read on the legacy repository only.
      # The Data repository GITHUB_TOKEN is not cross-repository authorization.
      GH_TOKEN: ${{ secrets.FREEPASS_DATA_LEGACY_ACTIONS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: freepass-creator/freepasserp4
          ref: e6727ff04fcf98380701fa6360c36f313e0e321f
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install platform and frozen adapter without lifecycle hooks
        run: |
          npm ci --ignore-scripts
          npm --prefix engine ci --ignore-scripts
      - name: Require dedicated delivery identity and private evidence bucket
        env:
          PROVIDER: ${{ vars.FREEPASS_DATA_REFRESH_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.FREEPASS_DATA_REFRESH_SERVICE_ACCOUNT }}
          BUCKET: ${{ vars.FREEPASS_DATA_REFRESH_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$PROVIDER"
          test "$ACCOUNT" = 'github-data-inventory-writer@freepasserp5.iam.gserviceaccount.com'
          test -n "$BUCKET"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FREEPASS_DATA_REFRESH_WIF_PROVIDER }}
          service_account: ${{ vars.FREEPASS_DATA_REFRESH_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify Data ownership before materializing supplier credentials
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'execute'
        run: |
          test -n "$GH_TOKEN"
          node --import tsx scripts/data-delivery-owner.mjs --preflight
      - name: Prepare private supplier credentials
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'execute'
        env:
          SHEETS_SA: ${{ secrets.GOOGLE_SA_JSON }}
          SONOGONG: ${{ secrets.SONOGONG_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$SHEETS_SA"
          test -n "$SONOGONG"
          umask 077
          mkdir -p engine/tmp/firebase-auth engine/sonokong/lib/wonja
          printf '%s' "$SHEETS_SA" > engine/tmp/firebase-auth/sheets.json
          printf '%s' "$SONOGONG" > engine/sonokong/lib/wonja/.손오공계정.json
      - name: Collect, refresh and deliver with per-stage owner checks
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'execute'
        run: node --import tsx scripts/data-delivery-owner.mjs --execute
      - name: Read-only shadow parity (no supplier/Sheet mutation)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'shadow'
        run: node --import tsx scripts/data-delivery-owner.mjs --shadow
      - name: Preserve immutable private snapshot and verify bytes
        if: always()
        env:
          BUCKET: ${{ vars.FREEPASS_DATA_REFRESH_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          test -f tmp/data-delivery-receipt.json || exit 0
          uri="gs://$BUCKET/delivery/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gcloud storage cp tmp/data-delivery-receipt.json "$uri/receipt.json" --if-generation-match=0
          gcloud storage cp "$uri/receipt.json" tmp/receipt-readback.json
          cmp tmp/data-delivery-receipt.json tmp/receipt-readback.json
          for snapshot in data-delivery-snapshot data-delivery-shadow; do
            if test -f "engine/tmp/$snapshot.json"; then
              gcloud storage cp "engine/tmp/$snapshot.json" "$uri/$snapshot.json" --if-generation-match=0
              gcloud storage cp "$uri/$snapshot.json" "tmp/$snapshot-readback.json"
              cmp "engine/tmp/$snapshot.json" "tmp/$snapshot-readback.json"
            fi
          done
      - name: Retain redacted attempt receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-delivery-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/data-delivery-receipt.json
          if-no-files-found: ignore
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f engine/tmp/firebase-auth/sheets.json engine/sonokong/lib/wonja/.손오공계정.json engine/sonokong/lib/wonja/.손오공토큰.json

  # 공통 입력시트 → FreePass Data Canonical 데일리 박제. ERP4 를 거치지 않고 Data 자기 신원(위 refresh 와 같은 신원·환경)으로 돈다.
  # 순서: ERP5 products 캡처(공급사 입력값 ②) → 공통 시트 캡처 → 계획(dry-run) → (apply 일 때만) 같은 계획 digest 로 적용·되읽기.
  shared-sheet-daily:
    if: github.event.schedule == '40 18 * * *' || (github.event_name == 'workflow_dispatch' && startsWith(inputs.mode, 'shared-sheet'))
    environment: data-production-delivery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_CLOUD_PROJECT: freepasserp5
      FIREBASE_PROJECT_ID: freepasserp5
      GOOGLE_SHEETS_SUBJECT: pyh@teamjpk.com
      SHARED_SHEET_ID: ${{ vars.FREEPASS_DATA_SHARED_SHEET_ID }}
      EVIDENCE_BUCKET: ${{ vars.FREEPASS_DATA_REFRESH_EVIDENCE_BUCKET }}
      # 예약 실행은 적용까지, 수동 실행은 고른 모드대로.
      APPLY: ${{ github.event_name == 'schedule' || inputs.mode == 'shared-sheet-apply' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require the Data delivery identity, sheet and private evidence bucket
        env:
          PROVIDER: ${{ vars.FREEPASS_DATA_REFRESH_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.FREEPASS_DATA_REFRESH_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$PROVIDER"
          test "$ACCOUNT" = 'github-data-inventory-writer@freepasserp5.iam.gserviceaccount.com'
          test -n "$SHARED_SHEET_ID"
          test -n "$EVIDENCE_BUCKET"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FREEPASS_DATA_REFRESH_WIF_PROVIDER }}
          service_account: ${{ vars.FREEPASS_DATA_REFRESH_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prepare private Sheets delegation credential
        env:
          SHEETS_SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          set -euo pipefail
          test -n "$SHEETS_SA"
          umask 077
          mkdir -p "$RUNNER_TEMP/shared-sheet"
          printf '%s' "$SHEETS_SA" > "$RUNNER_TEMP/shared-sheet/sheets.json"
      - name: Capture, plan and (apply) — counts only in the public log
        run: |
          set -euo pipefail
          umask 077
          T="$RUNNER_TEMP/shared-sheet"
          export GOOGLE_SHEETS_APPLICATION_CREDENTIALS="$T/sheets.json"
          export FREEPASS_ERP5_READ_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          export FREEPASS_DATA_EVIDENCE_BUCKET="$EVIDENCE_BUCKET"
          node --import tsx src/jobs/inspect-erp5-source.ts --live-read-only > "$T/erp5-report.json"
          ERP5_CAPTURE="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).privateCapturePath)" "$T/erp5-report.json")"
          node --import tsx src/jobs/capture-shared-sheet.ts --spreadsheet "$SHARED_SHEET_ID" --erp5-capture "$ERP5_CAPTURE" --out "$T/capture.json"
          node --import tsx src/jobs/ingest-shared-sheet-canonical.ts --firestore --capture "$T/capture.json" --plan-out "$T/plan.json" > "$T/report.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(r.mode!=='DRY_RUN'||r.writes!==0)process.exit(1);const {suppliers,...s}=r;console.log(JSON.stringify(s,null,2))" "$T/report.json"
          if [ "$APPLY" = 'true' ]; then
            DIGEST="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).planDigest)" "$T/report.json")"
            set +e
            node --import tsx src/jobs/ingest-shared-sheet-canonical.ts --firestore --apply --plan "$T/plan.json" --expected-plan-digest "$DIGEST" > "$T/apply.json"
            code=$?
            set -e
            cat "$T/apply.json"
            # PARTIAL_HOLD(=2) is expected while some cars are held; anything else, or a read-back mismatch, fails the run.
            node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const ok=['APPLIED','PARTIAL_HOLD'].includes(r.status)&&(r.reconciliation?.readbackMismatches??1)===0;process.exit(ok?0:1)" "$T/apply.json"
            test "$code" = 0 -o "$code" = 2
          fi
      - name: Preserve private capture, plan and reports (location not printed)
        if: always()
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/shared-sheet"
          uri="gs://$EVIDENCE_BUCKET/shared-sheet-daily/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for f in capture.json plan.json report.json apply.json; do
            if test -f "$T/$f"; then
              gcloud storage cp --no-user-output-enabled "$T/$f" "$uri/$f" --if-generation-match=0
              gcloud storage cp --no-user-output-enabled "$uri/$f" "$T/$f.readback"
              cmp "$T/$f" "$T/$f.readback"
            fi
          done
          echo "private evidence stored and verified"
      - name: Remove temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/shared-sheet"
