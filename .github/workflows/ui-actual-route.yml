name: UI Actual Route QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'preview/**'
      - 'src/api/server.ts'
      - 'tests/vehicle-finder-*.test.ts'
      - 'tests/data-health-ui.test.ts'
      - 'tests/review-queue-ui.test.ts'
      - 'tests/entity-detail-ui.test.ts'
      - 'tests/control-tower-ui.test.ts'
      - 'scripts/tests/vehicle-finder-actual-route.browser.py'
      - 'scripts/tests/data-health-actual-route.browser.py'
      - 'scripts/tests/review-queue-actual-route.browser.py'
      - 'scripts/tests/entity-detail-actual-route.browser.py'
      - 'scripts/tests/control-tower-actual-route.browser.py'
      - '.github/workflows/ui-actual-route.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser QA Vehicle Finder actual route
        run: python scripts/tests/vehicle-finder-actual-route.browser.py --output ui-evidence/vehicle-finder
      - name: Browser QA Data Health actual route
        run: python scripts/tests/data-health-actual-route.browser.py --output ui-evidence/data-health
      - name: Browser QA Review Queue actual route
        run: python scripts/tests/review-queue-actual-route.browser.py --output ui-evidence/review-queue
      - name: Browser QA Entity Detail actual route
        run: python scripts/tests/entity-detail-actual-route.browser.py --output ui-evidence/entity-detail
      - name: Browser QA Control Tower actual route
        run: python scripts/tests/control-tower-actual-route.browser.py --output ui-evidence/control-tower
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-actual-routes
          path: ui-evidence
          if-no-files-found: ignore
