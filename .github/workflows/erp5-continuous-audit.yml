name: ERP5 continuous read-only audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

concurrency:
  group: erp5-continuous-read-only-audit
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ERP5_PROJECT_ID: freepasserp5
      EVIDENCE_BUCKET: ${{ vars.ERP5_EVIDENCE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: '579.0.0'
      - name: Verify the pinned Google Cloud CLI
        shell: bash
        run: gcloud version --format=json | jq -e '.["Google Cloud SDK"] == "579.0.0"' >/dev/null
      - run: npm ci
      - name: Fail closed until the read-only identity and private bucket are configured
        shell: bash
        run: |
          test -n '${{ vars.ERP5_WIF_PROVIDER }}'
          test -n '${{ vars.ERP5_READ_SERVICE_ACCOUNT }}'
          test -n '${{ vars.ERP5_POINTER_SERVICE_ACCOUNT }}'
          test -n "$EVIDENCE_BUCKET"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.ERP5_WIF_PROVIDER }}
          service_account: ${{ vars.ERP5_READ_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
      - name: Check all consumer health
        shell: bash
        env:
          FIREBASE_PROJECT_ID: freepasserp5
          NODE_ENV: production
          FREEPASS_ERP5_READ_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONSUMER_HEALTH_MAX_AGE_MINUTES: ${{ vars.SHEET_EVIDENCE_MAX_AGE_MINUTES }}
          CONSUMER_HEALTH_MAX_FUTURE_SKEW_SECONDS: ${{ vars.SHEET_EVIDENCE_MAX_FUTURE_SKEW_SECONDS }}
        run: |
          set -euo pipefail
          if [ -z "${CONSUMER_HEALTH_MAX_AGE_MINUTES:-}" ]; then
            jq -n '{
              version: "consumer-health-schedule/1",
              configured: false,
              status: "BLOCKED",
              reason: "CONSUMER_HEALTH_MAX_AGE_MINUTES_NOT_CONFIGURED"
            }' > consumer-health-summary.json
          else
            skew="${CONSUMER_HEALTH_MAX_FUTURE_SKEW_SECONDS:-0}"
            set +e
            npx tsx src/jobs/check-consumer-health.ts \
              --scheduled-read-only \
              --max-age-minutes="$CONSUMER_HEALTH_MAX_AGE_MINUTES" \
              --max-future-skew-seconds="$skew" \
              --event-limit=1000 \
              > consumer-health.json
            code=$?
            set -e
            test "$code" -eq 0 -o "$code" -eq 2
            jq -e '
              .contractVersion == "consumer-health-v1" and
              .schemaVersion == "1.0.0" and
              (.status == "HEALTHY" or .status == "DEGRADED" or .status == "BLOCKED") and
              (.consumers | length == 8) and
              ([.consumers[].consumerId] | sort == [
                "erp-com-public-catalog",
                "erp-whitelabel-catalogs",
                "freepass-admin-catalog",
                "freepass-estimate-catalog",
                "freepass-sales-catalog",
                "google-sheets-f01",
                "google-sheets-f86",
                "kakao-ops-catalog"
              ])
            ' consumer-health.json >/dev/null
            jq -n \
              --slurpfile health consumer-health.json \
              '{
                version: "consumer-health-schedule/1",
                configured: true,
                status: $health[0].status,
                generatedAt: $health[0].generatedAt,
                counts: {
                  HEALTHY: ($health[0].consumers | map(select(.status == "HEALTHY")) | length),
                  DEGRADED: ($health[0].consumers | map(select(.status == "DEGRADED")) | length),
                  BLOCKED: ($health[0].consumers | map(select(.status == "BLOCKED")) | length)
                },
                consumerStatuses: ($health[0].consumers | map({
                  consumerId,
                  status,
                  currentStage,
                  nextStage,
                  source: .evidence.source,
                  evidenceState: .evidence.state,
                  releaseAuthority: .evidence.releaseAuthority,
                  releaseId: .evidence.releaseId,
                  blockers
                }))
              }' > consumer-health-summary.json
          fi
          jq -e '
            .version == "consumer-health-schedule/1" and
            (.configured | type == "boolean") and
            (.status == "HEALTHY" or .status == "DEGRADED" or .status == "BLOCKED")
          ' consumer-health-summary.json >/dev/null
          {
            echo '## Consumer health — all registered consumers'
            echo
            echo "Configured: $(jq -r '.configured' consumer-health-summary.json)"
            echo
            echo "Status: $(jq -r '.status' consumer-health-summary.json)"
            if [ "$(jq -r '.configured' consumer-health-summary.json)" = true ]; then
              echo
              echo "HEALTHY: $(jq -r '.counts.HEALTHY' consumer-health-summary.json) · DEGRADED: $(jq -r '.counts.DEGRADED' consumer-health-summary.json) · BLOCKED: $(jq -r '.counts.BLOCKED' consumer-health-summary.json)"
              echo
              jq -r '.consumerStatuses[] | "- \(.consumerId): \(.status) / stage=\(.currentStage)→\(.nextStage // "final") / source=\(.source) / evidence=\(.evidenceState) / authority=\(.releaseAuthority // "none") / blockers=\(.blockers | join(", "))"' consumer-health-summary.json
            else
              echo
              echo "Reason: $(jq -r '.reason' consumer-health-summary.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check consumer readiness
        shell: bash
        env:
          FIREBASE_PROJECT_ID: freepasserp5
          NODE_ENV: production
          FREEPASS_ERP5_READ_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONSUMER_READINESS_MAX_AGE_MINUTES: ${{ vars.SHEET_EVIDENCE_MAX_AGE_MINUTES }}
          CONSUMER_READINESS_MAX_FUTURE_SKEW_SECONDS: ${{ vars.SHEET_EVIDENCE_MAX_FUTURE_SKEW_SECONDS }}
        run: |
          set -euo pipefail
          if [ -z "${CONSUMER_READINESS_MAX_AGE_MINUTES:-}" ]; then
            jq -n '{
              version: "consumer-readiness-schedule/1",
              configured: false,
              status: "BLOCKED",
              reason: "CONSUMER_READINESS_MAX_AGE_MINUTES_NOT_CONFIGURED"
            }' > consumer-readiness-summary.json
          else
            skew="${CONSUMER_READINESS_MAX_FUTURE_SKEW_SECONDS:-0}"
            set +e
            npx tsx src/jobs/check-consumer-readiness.ts \
              --scheduled-read-only \
              --max-age-minutes="$CONSUMER_READINESS_MAX_AGE_MINUTES" \
              --max-future-skew-seconds="$skew" \
              --event-limit=1000 \
              > consumer-readiness.json
            code=$?
            set -e
            test "$code" -eq 0 -o "$code" -eq 2
            jq -e '
              .contractVersion == "consumer-readiness-v1" and
              .schemaVersion == "1.0.0" and
              (.consumers | length == 8) and
              ((.counts.readyForNextStage + .counts.hold + .counts.final) == 8) and
              (.readyTransitions | type == "array")
            ' consumer-readiness.json >/dev/null
            jq -n \
              --slurpfile readiness consumer-readiness.json \
              '{
                version: "consumer-readiness-schedule/1",
                configured: true,
                status: (if $readiness[0].counts.hold > 0 then "BLOCKED"
                         elif $readiness[0].counts.readyForNextStage > 0 then "DEGRADED"
                         else "HEALTHY" end),
                generatedAt: $readiness[0].generatedAt,
                counts: $readiness[0].counts,
                readyTransitions: $readiness[0].readyTransitions,
                consumers: ($readiness[0].consumers | map({
                  consumerId,
                  readiness,
                  currentStage,
                  nextStage,
                  healthStatus,
                  evidenceSource,
                  evidenceState,
                  releaseId,
                  requiredActions,
                  blockers
                }))
              }' > consumer-readiness-summary.json
          fi
          jq -e '
            .version == "consumer-readiness-schedule/1" and
            (.configured | type == "boolean") and
            (.status == "HEALTHY" or .status == "DEGRADED" or .status == "BLOCKED")
          ' consumer-readiness-summary.json >/dev/null
          {
            echo '## Consumer readiness — next-stage actions'
            echo
            echo "Configured: $(jq -r '.configured' consumer-readiness-summary.json)"
            echo
            echo "Status: $(jq -r '.status' consumer-readiness-summary.json)"
            if [ "$(jq -r '.configured' consumer-readiness-summary.json)" = true ]; then
              echo
              echo "READY: $(jq -r '.counts.readyForNextStage' consumer-readiness-summary.json) · HOLD: $(jq -r '.counts.hold' consumer-readiness-summary.json) · FINAL: $(jq -r '.counts.final' consumer-readiness-summary.json)"
              echo
              jq -r '.consumers[] | "- \(.consumerId): \(.readiness) / \(.currentStage)→\(.nextStage // "final") / actions=\(.requiredActions | join(", ")) / blockers=\(.blockers | join(", "))"' consumer-readiness-summary.json
            else
              echo
              echo "Reason: $(jq -r '.reason' consumer-readiness-summary.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check F01/F86 consumer health
        shell: bash
        env:
          FIREBASE_PROJECT_ID: freepasserp5
          NODE_ENV: production
          FREEPASS_ERP5_READ_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SHEET_EVIDENCE_MAX_AGE_MINUTES: ${{ vars.SHEET_EVIDENCE_MAX_AGE_MINUTES }}
          SHEET_EVIDENCE_MAX_FUTURE_SKEW_SECONDS: ${{ vars.SHEET_EVIDENCE_MAX_FUTURE_SKEW_SECONDS }}
        run: |
          set -euo pipefail
          if [ -z "${SHEET_EVIDENCE_MAX_AGE_MINUTES:-}" ]; then
            jq -n '{
              version: "sheet-consumer-health-schedule/1",
              configured: false,
              status: "BLOCKED",
              reason: "SHEET_EVIDENCE_MAX_AGE_MINUTES_NOT_CONFIGURED"
            }' > sheet-consumer-health-summary.json
          else
            skew="${SHEET_EVIDENCE_MAX_FUTURE_SKEW_SECONDS:-0}"
            set +e
            npx tsx src/jobs/check-sheet-consumer-health.ts \
              --scheduled-read-only \
              --max-age-minutes="$SHEET_EVIDENCE_MAX_AGE_MINUTES" \
              --max-future-skew-seconds="$skew" \
              > sheet-consumer-health.json
            code=$?
            set -e
            test "$code" -eq 0 -o "$code" -eq 2
            jq -e '
              .contractVersion == "sheet-consumer-health-v1" and
              .schemaVersion == "1.0.0" and
              (.status == "HEALTHY" or .status == "DEGRADED" or .status == "BLOCKED") and
              (.consumers | length == 2) and
              ([.consumers[].consumerId] | sort == ["google-sheets-f01","google-sheets-f86"])
            ' sheet-consumer-health.json >/dev/null
            jq -n \
              --slurpfile health sheet-consumer-health.json \
              '{
                version: "sheet-consumer-health-schedule/1",
                configured: true,
                status: $health[0].status,
                generatedAt: $health[0].generatedAt,
                consumerStatuses: ($health[0].consumers | map({
                  consumerId,
                  status,
                  currentStage,
                  nextStage,
                  releaseAuthority: .evidence.releaseAuthority,
                  receiptId: .evidence.receiptId,
                  blockers
                }))
              }' > sheet-consumer-health-summary.json
          fi
          jq -e '
            .version == "sheet-consumer-health-schedule/1" and
            (.configured | type == "boolean") and
            (.status == "HEALTHY" or .status == "DEGRADED" or .status == "BLOCKED")
          ' sheet-consumer-health-summary.json >/dev/null
          {
            echo '## F01/F86 consumer health'
            echo
            echo "Configured: $(jq -r '.configured' sheet-consumer-health-summary.json)"
            echo
            echo "Status: $(jq -r '.status' sheet-consumer-health-summary.json)"
            if [ "$(jq -r '.configured' sheet-consumer-health-summary.json)" = true ]; then
              echo
              jq -r '.consumerStatuses[] | "- \(.consumerId): \(.status) / stage=\(.currentStage) / authority=\(.releaseAuthority // "none") / blockers=\(.blockers | join(", "))"' sheet-consumer-health-summary.json
            else
              echo
              echo "Reason: $(jq -r '.reason' sheet-consumer-health-summary.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Capture the current FULL Firestore snapshot
        id: capture
        shell: bash
        env:
          FREEPASS_ERP5_READ_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set +e
          npx tsx src/jobs/inspect-erp5-source.ts --live-read-only > capture-summary.json
          code=$?
          set -e
          test "$code" -eq 2
          jq -e '
            .status == "HOLD" and
            .cutoverAuthorized == false and
            .canonicalWriteAuthorized == false and
            (.sourceDigest | type == "string" and length == 64) and
            (.readTime | type == "string" and length > 0) and
            (.products | type == "number" and . >= 0) and
            (.policies | type == "number" and . >= 0) and
            (.privateCapturePath | type == "string" and length > 0)
          ' capture-summary.json >/dev/null
          capture_path=$(jq -er '.privateCapturePath' capture-summary.json)
          test -f "$capture_path"
          echo "path=$capture_path" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$capture_path")" >> "$GITHUB_OUTPUT"
      - name: Load the last accepted observation pointer
        id: previous
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_dir="$HOME/.codex/private/freepass-data-source-captures/previous"
          mkdir -p "$previous_dir"
          http_code="$(curl --silent --show-error \
            --output "$previous_dir/latest-metadata.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GCS_ACCESS_TOKEN" \
            "https://storage.googleapis.com/storage/v1/b/$EVIDENCE_BUCKET/o/latest.json")"
          if [ "$http_code" = 200 ]; then
            generation=$(jq -er '.generation | select(type == "string" and test("^[1-9][0-9]*$"))' "$previous_dir/latest-metadata.json")
            media_code="$(curl --silent --show-error \
              --output "$previous_dir/latest.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GCS_ACCESS_TOKEN" \
              "https://storage.googleapis.com/storage/v1/b/$EVIDENCE_BUCKET/o/latest.json?alt=media&ifGenerationMatch=$generation")"
            test "$media_code" = 200
            jq -e '
              .version == "erp5-continuous-pointer/1" and
              (.captureUri | type == "string" and length > 0) and
              (.sourceDigest | type == "string" and length == 64) and
              (.readTime | type == "string" and length > 0) and
              (.runId | type == "string" and length > 0)
            ' "$previous_dir/latest.json" >/dev/null
            uri=$(jq -er '.captureUri' "$previous_dir/latest.json")
            case "$uri" in
              "gs://$EVIDENCE_BUCKET/runs/"*/source/capture.json) ;;
              *) echo '::error::HOLD: latest.json captureUri is outside the evidence bucket run prefix'; exit 1 ;;
            esac
            gcloud storage cp "$uri" "$previous_dir/capture.json"
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo "path=$previous_dir/capture.json" >> "$GITHUB_OUTPUT"
            echo "generation=$generation" >> "$GITHUB_OUTPUT"
          elif [ "$http_code" = 404 ]; then
            rm -f "$previous_dir/latest-metadata.json"
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'generation=0' >> "$GITHUB_OUTPUT"
          else
            echo "::error::HOLD: latest.json read failed with HTTP $http_code; preserving the last-known-good pointer"
            exit 1
          fi
      - name: Build immutable dry-run and delta evidence
        shell: bash
        run: |
          set +e
          if [ '${{ steps.previous.outputs.available }}' = true ]; then
            npx tsx src/jobs/build-erp5-canonical-dry-run.ts --capture '${{ steps.capture.outputs.path }}' --previous '${{ steps.previous.outputs.path }}' > dry-run-summary.json
          else
            npx tsx src/jobs/build-erp5-canonical-dry-run.ts --capture '${{ steps.capture.outputs.path }}' > dry-run-summary.json
          fi
          code=$?
          set -e
          test "$code" -eq 2
          jq -e '
            .version == "erp5-canonical-dry-run/1" and
            .status == "HOLD" and
            .canonicalWriteAuthorized == false and
            .publicationGate.version == "erp5-publication-gate/1" and
            .publicationGate.decision == "HOLD" and
            .publicationGate.sourceCoverage.mode == "FULL" and
            .publicationGate.sourceCoverage.completeness == "COMPLETE" and
            .publicationGate.sourceCoverage.observedProducts == .counts.sourceProducts and
            .publicationGate.sourceCoverage.candidateProducts == .counts.candidates and
            .publicationGate.reviewCoverage.mappedForReview == .counts.mappedForReview and
            .publicationGate.reviewCoverage.mappingHold == .counts.hold and
            .publicationGate.reviewCoverage.approvedCanonicalProducts == 0 and
            .publicationGate.activeReleaseAuthorized == false and
            (.publicationGate.reasons | index("REVIEW_APPROVALS_NOT_INCLUDED") != null) and
            (.publicationGate.reasons | index("CANONICAL_RELEASE_NOT_BUILT") != null) and
            (.sourceDigest | type == "string" and length == 64) and
            (.counts.sourceProducts | type == "number" and . >= 0) and
            (.counts.candidates == .counts.sourceProducts) and
            (.privateOutputPath | type == "string" and length > 0)
          ' dry-run-summary.json >/dev/null
          if [ '${{ steps.previous.outputs.available }}' = true ]; then
            jq -e '
              .delta != null and
              .delta.destructiveActionAuthorized == false and
              (.delta.digest | type == "string" and length == 64)
            ' dry-run-summary.json >/dev/null
          else
            jq -e '.delta == null' dry-run-summary.json >/dev/null
          fi
      - name: Build the source identity and count card
        shell: bash
        run: |
          jq -n \
            --slurpfile capture capture-summary.json \
            --slurpfile dryRun dry-run-summary.json \
            --arg runId "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '{
              version: "erp5-source-inventory/1",
              source: {
                projectId: "freepasserp5",
                databaseId: "(default)",
                collections: {
                  products: $capture[0].products,
                  policy: $capture[0].policies
                },
                readTime: $capture[0].readTime,
                digest: $capture[0].sourceDigest,
                coverage: "FULL_SAME_READ_ONLY_TRANSACTION"
              },
              recognition: {
                productFieldPathCount: $dryRun[0].fieldProfile.fieldPathCount,
                mappedForReview: $dryRun[0].counts.mappedForReview,
                mappingHold: $dryRun[0].counts.hold,
                inventoryTransitionCount: ($dryRun[0].delta.inventoryTransitionCount // null)
              },
              change: ($dryRun[0].delta // {status:"FIRST_OBSERVATION"}),
              authority: {
                canonicalWriteAuthorized: false,
                destructiveActionAuthorized: false,
                activeReleaseAuthorized: $dryRun[0].publicationGate.activeReleaseAuthorized,
                publicationDecision: $dryRun[0].publicationGate.decision,
                publicationHoldReasons: $dryRun[0].publicationGate.reasons
              },
              runId: $runId
            }' > source-inventory.json
          jq -e '
            .source.collections.products >= 0 and
            .source.collections.policy >= 0 and
            .recognition.productFieldPathCount >= 0 and
            .authority.canonicalWriteAuthorized == false and
            .authority.destructiveActionAuthorized == false and
            .authority.activeReleaseAuthorized == false and
            .authority.publicationDecision == "HOLD" and
            (.authority.publicationHoldReasons | length > 0)
          ' source-inventory.json >/dev/null
          {
            echo '## ERP5 source identity and count card'
            echo
            echo '| Evidence | Value |'
            echo '| --- | ---: |'
            echo "| products | $(jq -r '.source.collections.products' source-inventory.json) |"
            echo "| policy | $(jq -r '.source.collections.policy' source-inventory.json) |"
            echo "| product field paths | $(jq -r '.recognition.productFieldPathCount' source-inventory.json) |"
            echo "| added | $(jq -r '.change.counts.ADDED // "first observation"' source-inventory.json) |"
            echo "| changed | $(jq -r '.change.counts.CHANGED // "first observation"' source-inventory.json) |"
            echo "| missing from source | $(jq -r '.change.counts.MISSING_FROM_SOURCE // "first observation"' source-inventory.json) |"
            echo "| inventory transitions | $(jq -r '.recognition.inventoryTransitionCount // "first observation"' source-inventory.json) |"
            echo "| publication decision | $(jq -r '.authority.publicationDecision' source-inventory.json) |"
            echo "| ACTIVE release authorized | $(jq -r '.authority.activeReleaseAuthorized' source-inventory.json) |"
            echo
            echo "Read time: $(jq -r '.source.readTime' source-inventory.json)"
            echo
            echo "Source digest: $(jq -r '.source.digest' source-inventory.json)"
            echo
            echo "Publication HOLD reasons: $(jq -r '.authority.publicationHoldReasons | join(", ")' source-inventory.json)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist immutable evidence and read it back
        shell: bash
        run: |
          set -euo pipefail
          run_uri="gs://$EVIDENCE_BUCKET/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          while IFS= read -r -d '' evidence; do
            gcloud storage cp "$evidence" "$run_uri/source/$(basename "$evidence")" --if-generation-match=0
          done < <(find '${{ steps.capture.outputs.dir }}' -maxdepth 1 -type f -name '*.json' -print0)
          for evidence in capture-summary.json dry-run-summary.json source-inventory.json; do
            gcloud storage cp "$evidence" "$run_uri/$evidence" --if-generation-match=0
          done
          capture_uri="$run_uri/source/capture.json"
          mkdir -p evidence-readback/source
          gcloud storage cp "$capture_uri" evidence-readback/source/capture.json
          gcloud storage cp "$run_uri/capture-summary.json" evidence-readback/capture-summary.json
          gcloud storage cp "$run_uri/dry-run-summary.json" evidence-readback/dry-run-summary.json
          gcloud storage cp "$run_uri/source-inventory.json" evidence-readback/source-inventory.json
          cmp -s '${{ steps.capture.outputs.path }}' evidence-readback/source/capture.json
          cmp -s capture-summary.json evidence-readback/capture-summary.json
          cmp -s dry-run-summary.json evidence-readback/dry-run-summary.json
          cmp -s source-inventory.json evidence-readback/source-inventory.json
          gcloud storage objects describe "$capture_uri" --format='value(generation)' | grep -Eq '^[1-9][0-9]*$'
          jq -n \
            --arg captureUri "$capture_uri" \
            --arg sourceDigest "$(jq -r '.sourceDigest' capture-summary.json)" \
            --arg readTime "$(jq -r '.readTime' capture-summary.json)" \
            --arg runId "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '{version:"erp5-continuous-pointer/1",captureUri:$captureUri,sourceDigest:$sourceDigest,readTime:$readTime,runId:$runId}' \
            > latest.json
      - name: Authenticate the pointer-only identity
        id: pointer-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.ERP5_WIF_PROVIDER }}
          service_account: ${{ vars.ERP5_POINTER_SERVICE_ACCOUNT }}
      - name: Advance latest.json atomically and read it back
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage cp latest.json "gs://$EVIDENCE_BUCKET/latest.json" \
            --if-generation-match='${{ steps.previous.outputs.generation }}'
          gcloud storage cp "gs://$EVIDENCE_BUCKET/latest.json" latest-readback.json
          cmp -s latest.json latest-readback.json
          generation="$(gcloud storage objects describe "gs://$EVIDENCE_BUCKET/latest.json" --format='value(generation)')"
          test "$generation" -gt '${{ steps.previous.outputs.generation }}'
          jq -e --arg runId "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '.version == "erp5-continuous-pointer/1" and .runId == $runId' latest-readback.json >/dev/null
      - name: Retain non-sensitive summaries for operator inspection
        uses: actions/upload-artifact@v4
        with:
          name: erp5-audit-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            capture-summary.json
            dry-run-summary.json
            source-inventory.json
            consumer-health-summary.json
            consumer-health.json
            consumer-readiness-summary.json
            consumer-readiness.json
            sheet-consumer-health-summary.json
            sheet-consumer-health.json
          retention-days: 90
          if-no-files-found: error
