name: Estimate master readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/estimate-master-readiness.yml'
      - 'src/application/estimate-master-canonical.ts'
      - 'src/application/estimate-master-readiness.ts'
      - 'src/jobs/check-estimate-master-readiness.ts'
      - 'src/jobs/data-access-runtime.ts'

concurrency:
  group: estimate-master-readiness
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_BUCKET: ${{ vars.ERP5_EVIDENCE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail closed until read-only identity is configured
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ vars.ERP5_WIF_PROVIDER }}'
          test -n '${{ vars.ERP5_READ_SERVICE_ACCOUNT }}'
          test -n "$EVIDENCE_BUCKET"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.ERP5_WIF_PROVIDER }}
          service_account: ${{ vars.ERP5_READ_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
      - name: Read canonical Vehicle Master and assess Estimate projection
        shell: bash
        env:
          FIREBASE_PROJECT_ID: freepasserp5
          NODE_ENV: production
          FREEPASS_ERP5_READ_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set +e
          npx tsx src/jobs/check-estimate-master-readiness.ts --scheduled-read-only > estimate-master-readiness.json
          code=$?
          set -e
          test "$code" -eq 0 -o "$code" -eq 2
          jq -e '
            .contractVersion == "estimate-master-readiness-v1" and
            .schemaVersion == "1.0.0" and
            .projectionId == "estimate-newcar-master" and
            (.status == "READY" or .status == "DEGRADED" or .status == "BLOCKED") and
            .activeReleaseAuthorized == false and
            .publicationImplemented == false and
            (.inputDigest | type == "string" and length == 64)
          ' estimate-master-readiness.json >/dev/null
          {
            echo '## Estimate master readiness'
            echo
            echo "Status: $(jq -r '.status' estimate-master-readiness.json)"
            echo "Total canonical trims: $(jq -r '.counts.total' estimate-master-readiness.json)"
            echo "ACTIVE-ready: $(jq -r '.counts.active' estimate-master-readiness.json)"
            echo "HOLD: $(jq -r '.counts.hold' estimate-master-readiness.json)"
            echo "Active rate: $(jq -r '.activeRate' estimate-master-readiness.json)"
            echo "Blockers: $(jq -r 'if (.blockers | length) == 0 then "none" else (.blockers | join(", ")) end' estimate-master-readiness.json)"
            echo
            echo 'Top HOLD reasons:'
            jq -r '.holdReasons[:12][]? | "- \(.reason): \(.count)"' estimate-master-readiness.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estimate-master-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: estimate-master-readiness.json
          retention-days: 90
          if-no-files-found: warn
