name: Shared sheet daily snapshot
# 실행 제목에 모드를 남긴다 — 매시 감시(daily-writer-guard)가 적용 실행을 이 제목으로 알아본다.
run-name: shared-sheet-daily ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}

# 공통 시트 → FreePass Data 하루 한 번 박제(대표 «두 갈래», 신원 승인 10-04 ①안).
# 이 파일만 매일 박제 계정(github-data-inventory-writer)을 빌릴 수 있다: WIF 공급자 조건이 이 파일의 workflow_ref·main·
# environment 로 묶여 있고, 변수 이름도 refresh(매시 배달)와 따로 쓴다(FREEPASS_DATA_DAILY_*).
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, apply]
        default: dry-run
  schedule:
    # 매일 03:40 KST. 매시 배달(data-owned-refresh)과 같은 동시성 그룹이라 겹치지 않는다.
    # GitHub 예약은 부하 때 빠지거나 몇 시간 밀린다(10-05 첫 예약 03:40 실행이 아예 만들어지지 않음, «매시» 감사도 4~6시간 간격).
    # 그래서 04:40·05:40·06:40 KST 에 다시 시도한다 — 관문이 «오늘(KST) 이미 적용 성공»이면 건너뛴다(하루 한 번 그대로).
    - cron: '40 18 * * *'
    - cron: '40 19 * * *'
    - cron: '40 20 * * *'
    - cron: '40 21 * * *'

concurrency:
  group: freepass-data-production-delivery
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  # 예약 실행 전 최근 매시 감사의 daily-writer-guard 결과를 읽는다. 감사가 오래됐으면(GitHub 예약이 몇 시간 밀림) 감사 workflow 를 한 번 직접 띄워 기다린다(dispatch 에 write 필요).
  actions: write

env:
  FREEPASS_SHEET_F01_ID: ${{ secrets.FREEPASS_SHEET_F01_ID }}
  FREEPASS_SHEET_F86_ID: ${{ secrets.FREEPASS_SHEET_F86_ID }}
  FREEPASS_SHEET_F04_ID: ${{ secrets.FREEPASS_SHEET_F04_ID }}

jobs:
  shared-sheet-daily:
    environment: data-production-delivery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_CLOUD_PROJECT: freepasserp5
      FIREBASE_PROJECT_ID: freepasserp5
      # Secret (masked in logs): the sheet ID must not appear in this public repository's run logs.
      SHARED_SHEET_ID: ${{ secrets.FREEPASS_DATA_SHARED_SHEET_ID }}
      # 예약 실행은 적용까지, 수동 실행은 고른 모드대로.
      APPLY: ${{ github.event_name == 'schedule' || inputs.mode == 'apply' }}
    steps:
      # 관문(environment 변수는 job if 에서 안 보이므로 첫 단계):
      #  - 예약 실행: FREEPASS_DATA_SHARED_SHEET_DAILY == 'on' 이고, 최근(3시간 안) 매시 감사의 daily-writer-guard 가
      #    성공이어야 한다 — 감시가 꺼졌거나 보류·경보(경로 없는 쓰기 포함)면 쓰지 않고 실패로 알린다.
      #  - 수동 apply: environment data-production-delivery 에 사람 승인(필수 검토자)이 없으므로(10-04 확인)
      #    FREEPASS_DATA_DAILY_MANUAL_APPLY == 'on' 일 때만. 통제된 첫 적용 때만 켜고 끝나면 지운다.
      #  - 수동 dry-run: 쓰기 0 이라 항상.
      - name: Daily schedule and manual apply gate
        id: gate
        env:
          DAILY: ${{ vars.FREEPASS_DATA_SHARED_SHEET_DAILY }}
          MANUAL_APPLY: ${{ vars.FREEPASS_DATA_DAILY_MANUAL_APPLY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            if [ "$DAILY" != 'on' ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "daily schedule switch is off — skipped"; exit 0; fi
            # 하루 한 번: 날짜는 «실행 생성 시각의 KST 날짜» 하나로 센다. 이 실행과 같은 날(KST) 생성된 apply 실행 중 «쓰기 단계
            # (Apply to FreePass Data)에 들어간 것»이 있으면 다시 쓰지 않는다.
            # - 쓰기 단계는 성공·진행 중만 센다. 실패·취소·시간 초과는 «오늘 박제 완료»가 아니다(10-10 되읽기 불일치로 실패했는데 뒤 회차가 «이미 썼음»으로 건너뛰어 성공처럼 보였다).
            #   재시도가 안전한 근거: 각 차량 쓰기는 영수증 멱등키 + 기대 revision 으로 한 건씩 확인되고(이미 쓴 건 noChange), 계획은 매번 새로 세워 바뀌었으면 SHARED_SHEET_PLAN_STALE 로 멈춘다.
            # - 캡처·계획·관문에서 멈춘 실행(쓰기 단계 skipped·미시작)은 세지 않는다 — 읽기 실패로 하루를 놓치지 않게.
            # - 같은 실행의 이전 시도도 센다(filter=all). 지금 시도의 쓰기 단계는 아직 시작 전이라 세지 않는다.
            # - 그 날 생성 범위를 페이지 끝까지 읽는다. 조회가 실패하면 «이력 없음»으로 보지 않고 멈춘다.
            # - 수동 apply(FREEPASS_DATA_DAILY_MANUAL_APPLY=on)는 상황실이 통제하는 예외라 이 검사를 하지 않는다.
            # - 이 단계를 나누기 전 판의 한 단계(«Capture, plan and (apply)»)도 쓰기 단계로 센다(캡처·쓰기를 가릴 수 없어 보수적으로).
            # 기준 날짜 = 이 실행(재실행이어도 처음 생성된 실행)의 생성 시각을 KST 로 바꾼 날짜. 그 날 0시~다음 날 0시에 생성된 실행만 본다.
            created="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')" || { echo "DAILY_ONCE_CHECK_FAILED: this run"; exit 1; }
            day="$(date -u -d "@$(( $(date -u -d "$created" +%s) + 32400 ))" +%F)"  # KST = UTC+9, 서머타임 없음
            since_s=$(( $(date -u -d "$day 00:00" +%s) - 32400 )); since="$(date -u -d "@$since_s" +%Y-%m-%dT%H:%M:%SZ)"
            until="$(date -u -d "@$(( since_s + 86399 ))" +%Y-%m-%dT%H:%M:%SZ)"  # 범위 양 끝 포함이라 다음 날 0시는 빼고
            ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/shared-sheet-daily.yml/runs?branch=main&created=$since..$until&per_page=100" --jq '.workflow_runs[] | select(.display_title | endswith(" apply")) | .id')"               || { echo "DAILY_ONCE_CHECK_FAILED: run list"; exit 1; }
            applied=0
            for id in $ids; do
              ok="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=all&per_page=100" --jq '[.jobs[].steps[] | select(((.name | startswith("Apply to FreePass Data")) or (.name | startswith("Capture, plan and (apply)"))) and .conclusion != "skipped" and .conclusion != "failure" and .conclusion != "cancelled" and .conclusion != "timed_out" and .started_at != null)] | length' | awk '{s+=$1} END {print s+0}')"                 || { echo "DAILY_ONCE_CHECK_FAILED: jobs of $id"; exit 1; }
              applied=$(( applied + ok ))
            done
            if [ "$applied" -gt 0 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "already wrote on $day (KST) — retry schedule skipped"; exit 0; fi
            # 최근 매시 감사 실행(진행 중 포함 5개)의 daily-writer-guard job 중 «가장 늦게 끝난 것»이 기준 —
            # 진행 중인 실행에서 이미 실패한 감시가 있으면 그것이 이긴다.
            read_guard() {
              : > "$RUNNER_TEMP/guard-jobs.jsonl"
              audit_ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/erp5-continuous-audit.yml/runs?branch=main&per_page=5" --jq '.workflow_runs[].id')" || { echo "DAILY_WRITER_GUARD_NOT_OK: audit list unreadable — scheduled snapshot not run"; exit 1; }
              for id in $audit_ids; do
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100"                 --jq '.jobs[] | select(.name == "daily-writer-guard" and .status == "completed") | {conclusion, completed_at}' >> "$RUNNER_TEMP/guard-jobs.jsonl"
              done
              latest="$(jq -s 'sort_by(.completed_at) | last // {}' "$RUNNER_TEMP/guard-jobs.jsonl")"
              guard="$(jq -r '.conclusion // "missing"' <<<"$latest")"
              done_at="$(jq -r '.completed_at // empty' <<<"$latest")"
              age=-1; if test -n "$done_at"; then age=$(( $(date -u +%s) - $(date -u -d "$done_at" +%s) )); fi
            }
            read_guard
            # 감사가 3시간 넘게 안 돌았으면(GitHub 예약이 4~7시간 밀리는 일이 잦다 — 10-08·10-09 새벽 박제가 이것으로 통째 건너뜀)
            # 감사 workflow 를 한 번 직접 띄우고 최대 약 20분(30초 간격 40회) 기다린다. 새 감사가 «실패»로 끝나면 그 결과가 이겨서 그대로 멈춘다.
            if test -z "$done_at" || [ "$age" -lt 0 ] || [ "$age" -gt 10800 ]; then
              echo "guard is stale (age=${age}s) — dispatching a fresh continuous audit"
              dispatched_at="$(date -u +%s)"
              gh workflow run erp5-continuous-audit.yml --ref main -R "$GITHUB_REPOSITORY" || { echo "DAILY_WRITER_GUARD_NOT_OK: could not dispatch audit — scheduled snapshot not run"; exit 1; }
              for _ in $(seq 1 40); do
                sleep 30
                read_guard
                # 띄운 시각 «이후»에 끝난 가드만 인정(다른 감사의 오래된 결과로 끝내지 않는다). 감사가 이미 돌고 있으면 줄 서서 늦어질 수 있어 넉넉히 기다린다.
                if test -n "$done_at" && [ "$(date -u -d "$done_at" +%s)" -ge "$dispatched_at" ]; then break; fi
              done
            fi
            test -n "$done_at" || { echo "DAILY_WRITER_GUARD_NOT_OK: no completed guard job — scheduled snapshot not run"; exit 1; }
            if [ "$guard" != 'success' ] || [ "$age" -lt 0 ] || [ "$age" -gt 10800 ]; then
              echo "DAILY_WRITER_GUARD_NOT_OK: latest guard=$guard age=${age}s — scheduled snapshot not run"; exit 1
            fi
          elif [ "${{ inputs.mode }}" = 'apply' ] && [ "$MANUAL_APPLY" != 'on' ]; then
            echo "MANUAL_APPLY_DISABLED: set FREEPASS_DATA_DAILY_MANUAL_APPLY=on only for the controlled apply"; exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.gate.outputs.run == 'true'
      - name: Require the Data delivery identity, sheet and private evidence bucket
        if: steps.gate.outputs.run == 'true'
        env:
          PROVIDER: ${{ vars.FREEPASS_DATA_DAILY_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.FREEPASS_DATA_DAILY_SERVICE_ACCOUNT }}
          EVIDENCE_BUCKET: ${{ vars.FREEPASS_DATA_DAILY_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$PROVIDER"
          test "$ACCOUNT" = 'github-data-inventory-writer@freepasserp5.iam.gserviceaccount.com'
          test -n "$SHARED_SHEET_ID"
          node --input-type=module -e "import { assertCurrentSharedSheet } from './scripts/data-delivery-owner.mjs'; assertCurrentSharedSheet(process.env.SHARED_SHEET_ID);"
          test -n "$EVIDENCE_BUCKET"
      - uses: google-github-actions/auth@v2
        if: steps.gate.outputs.run == 'true'
        with:
          workload_identity_provider: ${{ vars.FREEPASS_DATA_DAILY_WIF_PROVIDER }}
          service_account: ${{ vars.FREEPASS_DATA_DAILY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gate.outputs.run == 'true'
      - name: Capture and plan (no writes) — counts only in the public log
        if: steps.gate.outputs.run == 'true'
        env:
          EVIDENCE_BUCKET: ${{ vars.FREEPASS_DATA_DAILY_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          T="$RUNNER_TEMP/shared-sheet"
          mkdir -p "$T"
          # 장기 개인 키·위임 없음(대표 승인 10-04): 공통 시트는 이 WIF 계정에 «보기» 공유, WIF 임시 자격(ADC)으로 spreadsheets.readonly.
          export FREEPASS_ERP5_READ_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          export FREEPASS_DATA_EVIDENCE_BUCKET="$EVIDENCE_BUCKET"
          # inspect-erp5-source exits 2 when it reports HOLD items, yet still writes a verified private capture.
          set +e
          node --import tsx src/jobs/inspect-erp5-source.ts --live-read-only > "$T/erp5-report.json"
          erp5_code=$?
          set -e
          test "$erp5_code" = 0 -o "$erp5_code" = 2
          ERP5_CAPTURE="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).privateCapturePath)" "$T/erp5-report.json")"
          test -f "$ERP5_CAPTURE"
          # 정정 이력(누가·언제·전→후): 시트 긴급 수정 엔진이 «--이력내보내기 YYYY-MM-DD» 로 뽑아 비공개 증거 버킷
          # shared-sheet-supplement/<KST 날짜>.json 에 올린 것 — 어제·오늘 두 날짜를 합쳐 보충값으로 넣는다.
          # 파일이 없으면 넘어가고, 그 밖의 실패(권한 등)는 멈춘다. 공개 로그에는 개수만.
          parts=()
          for d in "$(TZ=Asia/Seoul date -d yesterday +%F)" "$(TZ=Asia/Seoul date +%F)"; do
            set +e
            err="$(gcloud storage cp --no-user-output-enabled "gs://$FREEPASS_DATA_EVIDENCE_BUCKET/shared-sheet-supplement/$d.json" "$T/supplement-$d.json" 2>&1)"
            code=$?
            set -e
            if [ "$code" != 0 ]; then
              if grep -qiE 'not found|No URLs matched|matched no objects|404' <<<"$err"; then continue; fi
              echo "SUPPLEMENT_READ_FAILED $d"; exit 1
            fi
            parts+=("$T/supplement-$d.json")
          done
          # 합치기·UTC 변환·중복/충돌 판정(박제와 같은 차량번호 정규화)은 src/jobs/merge-shared-sheet-supplement.ts — 오류는 고정 코드만.
          node --import tsx src/jobs/merge-shared-sheet-supplement.ts "$T/supplement.json" "${parts[@]}"
          node --import tsx src/jobs/capture-shared-sheet.ts --spreadsheet "$SHARED_SHEET_ID" --erp5-capture "$ERP5_CAPTURE" --supplement "$T/supplement.json" --out "$T/capture.json"
          node --import tsx src/jobs/ingest-shared-sheet-canonical.ts --firestore --capture "$T/capture.json" --plan-out "$T/plan.json" > "$T/report.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(r.mode!=='DRY_RUN'||r.writes!==0)process.exit(1);const {suppliers,...s}=r;console.log(JSON.stringify(s,null,2))" "$T/report.json"
      # 쓰기는 따로 한 단계 — 하루 한 번 관문이 «쓰기 단계에 들어간 실행»만 센다(캡처·계획에서 멈춘 실행은 그날 재시도를 막지 않는다).
      - name: Apply to FreePass Data (writes) — counts only in the public log
        if: steps.gate.outputs.run == 'true' && env.APPLY == 'true'
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/shared-sheet"
          DIGEST="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).planDigest)" "$T/report.json")"
          set +e
          node --import tsx src/jobs/ingest-shared-sheet-canonical.ts --firestore --apply --plan "$T/plan.json" --expected-plan-digest "$DIGEST" > "$T/apply.json"
          code=$?
          set -e
          cat "$T/apply.json"
          # PARTIAL_HOLD(=2) is expected while some cars are held; anything else, or a read-back mismatch, fails the run.
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const ok=['APPLIED','PARTIAL_HOLD'].includes(r.status)&&(r.reconciliation?.readbackMismatches??1)===0;process.exit(ok?0:1)" "$T/apply.json"
          test "$code" = 0 -o "$code" = 2
      - name: Preserve private capture, plan and reports (location not printed)
        if: always() && steps.gate.outputs.run == 'true'
        env:
          EVIDENCE_BUCKET: ${{ vars.FREEPASS_DATA_DAILY_EVIDENCE_BUCKET }}
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/shared-sheet"
          uri="gs://$EVIDENCE_BUCKET/shared-sheet-daily/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for f in supplement.json capture.json plan.json report.json apply.json; do
            if test -f "$T/$f"; then
              gcloud storage cp --no-user-output-enabled "$T/$f" "$uri/$f" --if-generation-match=0
              gcloud storage cp --no-user-output-enabled "$uri/$f" "$T/$f.readback"
              cmp "$T/$f" "$T/$f.readback"
            fi
          done
          echo "private evidence stored and verified"
      - name: Remove temporary files
        if: always() && steps.gate.outputs.run == 'true'
        run: rm -rf "$RUNNER_TEMP/shared-sheet"
