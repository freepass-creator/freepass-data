name: Sonogong (RP012) collect draft

# 손오공(RP012) 15분 수집 실행용 GitHub Actions 초안.
# 기본은 읽기·보고서만(쓰기 0). --apply-raw 는 수동 입력 + 승인 환경변수일 때만.
# schedule 은 대표 승인 전 활성화 금지 — 아래 cron 은 주석으로만 둔다.

on:
  workflow_dispatch:
    inputs:
      apply_raw:
        description: RAW 적재 승인 시에만 true (기본 false = 쓰기 0)
        type: boolean
        default: false
  # schedule:
  #   - cron: '*/15 * * * *'  # 대표 승인 전 활성화 금지

# 겹침 금지: 진행 중 실행을 취소하지 않고, 같은 그룹에서는 한 번에 하나만 돈다.
concurrency:
  group: sonogong-collect
  cancel-in-progress: false

# 최소 권한. 손오공은 WIF 가 아니라 secrets.SONOGONG_ACCOUNT_JSON 주입이므로 id-token 불필요.
permissions:
  contents: read

jobs:
  sonogong-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 비밀 값은 로그·요약에 출력하지 않는다. 이름(시크릿 키)만 참조한다.
      SONOGONG_ACCOUNT_JSON: ${{ secrets.SONOGONG_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Collect Sonogong source (no secret echo, no set -x)
        id: collect
        # set -x 금지: 환경·인자가 로그에 풀릴 수 있다.
        run: |
          set -euo pipefail
          umask 077
          T="$RUNNER_TEMP/sonogong-collect"
          mkdir -p "$T"
          test -n "$SONOGONG_ACCOUNT_JSON"

          # --silent: npm 수명주기 문구가 stdout 에 섞여 보고서 JSON 파싱이 깨지지 않게 한다.
          # 계정·승인 값은 echo / set -x 로 찍지 않는다.
          set +e
          if [ "${{ inputs.apply_raw }}" = 'true' ]; then
            SONOGONG_RAW_INGEST_APPROVED=true npm run --silent source:sonogong -- --apply-raw > "$T/stdout.txt"
          else
            npm run --silent source:sonogong > "$T/stdout.txt"
          fi
          code=$?
          set -e

          # CLI 가 찍는 JSON 한 줄만 고른다. 공개 로그·summary 에는 허용 필드만(식별자·금액 금지).
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync(process.argv[1], "utf8").trim();
            const line = raw.split(/\r?\n/).filter(Boolean).at(-1);
            if (!line) throw new Error("SONOGONG_REPORT_MISSING");
            const report = JSON.parse(line);
            fs.writeFileSync(process.argv[2], line + "\n", { mode: 0o600 });
            const buckets = Array.isArray(report.buckets)
              ? report.buckets.map((b) => ({
                  bucket: b && b.bucket != null ? String(b.bucket) : "unknown",
                  rows: typeof b?.rows === "number" ? b.rows : null,
                }))
              : [];
            const summary = {
              status: report.status ?? null,
              coverage: report.coverage ?? null,
              buckets,
              candidateCount:
                typeof report.candidateCount === "number" ? report.candidateCount : null,
            };
            const lines = [
              "## Sonogong collect 요약",
              "",
              "- status: `" + String(summary.status) + "`",
              "- coverage: `" + String(summary.coverage) + "`",
              "- candidateCount: `" + String(summary.candidateCount) + "`",
              "- buckets:",
            ];
            for (const b of summary.buckets) {
              lines.push("  - `" + b.bucket + "`: rows=" + String(b.rows));
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            process.stdout.write(JSON.stringify(summary) + "\n");
          ' "$T/stdout.txt" "$T/report.json"

          # CLI 는 HOLD 등에서 exit 2. 0·2 만 수집 보고서로 인정하고 그 외는 실패.
          test "$code" = 0 -o "$code" = 2
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Remove temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/sonogong-collect"
