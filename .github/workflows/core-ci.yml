name: Core CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Architecture guard
        run: npm run check:arch
      - name: Standards conformance
        run: npm run check:standards
      - name: Data access boundary
        run: npm run check:data-access-boundary
      - name: Sheet contract tests
        run: npm run check:sheets
      - name: TypeScript build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Read runtime smoke
        run: npm run test:read-runtime-smoke
      - name: Shadow tests
        run: npm run test:shadow
      - name: Delivery owner fail-closed regressions
        run: npm run test:delivery-owner
      - name: Validate frozen photo runtime image
        shell: bash
        run: |
          set -euo pipefail
          source_sha='bd03f33b9bdedfb8f49ad8717062b32784e9a08a'
          test "$(git rev-parse "$source_sha^{tree}")" = 'f8b0d22400bff1987ae9cf1824302c99afefce05'
          test "$(git show -s --format=%P "$source_sha")" = 'c9b9a4b31d001c2cbffd43022c9213e01e3d2544'
          git merge-base --is-ancestor "$source_sha" HEAD
          source_dir="$(mktemp -d "$RUNNER_TEMP/photo-image.XXXXXX")"
          probe_file="$(mktemp "$RUNNER_TEMP/photo-image-probe.XXXXXX.mjs")"
          git show 'HEAD:scripts/verify-photo-rendition-runtime.mjs' > "$probe_file"
          chmod 0444 "$probe_file"
          git -c core.autocrlf=false archive "$source_sha" | tar -x -C "$source_dir"
          local_image="freepass-data-photo-image-check:$source_sha"
          docker build --pull --build-arg FREEPASS_DATA_ENTRYPOINT=dist/src/api/consumer-server.js --build-arg "FREEPASS_DATA_SOURCE_SHA=$source_sha" --label "org.opencontainers.image.revision=$source_sha" --tag "$local_image" "$source_dir"
          test "$(docker image inspect "$local_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$source_sha"
          docker image inspect "$local_image" --format '{{json .Config.Env}}' | jq -e 'index("FREEPASS_DATA_ENTRYPOINT=dist/src/api/consumer-server.js") != null' >/dev/null
          test "$(docker image inspect "$local_image" --format '{{ .Config.User }}')" = 'node'
          docker run --rm --network none --memory=512m --cpus=1 --entrypoint node --mount "type=bind,source=$probe_file,target=/tmp/sharp-list-runtime-probe.mjs,readonly" "$local_image" /tmp/sharp-list-runtime-probe.mjs
