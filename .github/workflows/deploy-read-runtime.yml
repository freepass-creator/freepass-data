name: Deploy FreePass Data read runtime

on:
  workflow_call:
    inputs:
      runtime_source_sha:
        required: false
        type: string
      expected_baseline_revision:
        required: false
        type: string
      expected_baseline_source_sha:
        required: false
        type: string
      expected_baseline_image_digest:
        required: false
        type: string
      service_name:
        required: false
        type: string
      runtime_service_account:
        required: false
        type: string
      entrypoint:
        required: false
        type: string
        default: dist/src/api/consumer-server.js
      allow_unauthenticated:
        required: false
        type: boolean
        default: false
      grant_public_invoker:
        required: false
        type: boolean
        default: false
      max_instances:
        required: false
        type: number
        default: 10
      concurrency:
        required: false
        type: number
        default: 8
      use_consumer_secrets:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      runtime_source_sha:
        description: Exact main ancestor for runtime source; empty uses workflow main
        type: string
        required: false
      expected_baseline_revision:
        type: string
        required: false
      expected_baseline_source_sha:
        type: string
        required: false
      expected_baseline_image_digest:
        type: string
        required: false
      verify_only:
        type: boolean
        default: false
      expected_source_sha:
        type: string
        required: false
      expected_image_digest:
        type: string
        required: false
      expected_consumers_secret_version:
        description: Expected consumer secret pin for verify-only; empty uses trusted repository pin
        type: string
        required: false
      expected_revision:
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - ".github/read-runtime-deploy.trigger"

concurrency:
  group: freepass-data-read-runtime-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  deploy:
    if: ${{ inputs.verify_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: freepasserp5
      REGION: ${{ vars.FREEPASS_DATA_READ_REGION }}
      SERVICE_NAME: ${{ inputs.service_name || vars.FREEPASS_DATA_READ_SERVICE_NAME }}
      ARTIFACT_REPOSITORY: ${{ vars.FREEPASS_DATA_ARTIFACT_REPOSITORY }}
      RUNTIME_SERVICE_ACCOUNT: ${{ inputs.runtime_service_account || vars.FREEPASS_DATA_RUNTIME_SERVICE_ACCOUNT }}
      RUNTIME_ENTRYPOINT: ${{ inputs.entrypoint || 'dist/src/api/consumer-server.js' }}
      ALLOW_UNAUTHENTICATED: ${{ inputs.allow_unauthenticated || false }}
      GRANT_PUBLIC_INVOKER: ${{ inputs.grant_public_invoker || false }}
      MAX_INSTANCES: ${{ inputs.max_instances || 10 }}
      RUNTIME_CONCURRENCY: ${{ inputs.concurrency || 8 }}
      USE_CONSUMER_SECRETS: ${{ toJSON(inputs.use_consumer_secrets) != 'false' }}
      CONSUMERS_SECRET_NAME: ${{ vars.FREEPASS_DATA_CONSUMERS_SECRET_NAME }}
      CONSUMERS_SECRET_VERSION: ${{ vars.FREEPASS_DATA_CONSUMERS_SECRET_VERSION }}
      IANCAR_SECRET_NAME: ${{ vars.FREEPASS_DATA_IANCAR_SECRET_NAME }}
      IANCAR_SECRET_VERSION: ${{ vars.FREEPASS_DATA_IANCAR_SECRET_VERSION }}
      # 이안카 사진 ID 기반 서빙 게이트를 켜는 공급사 목록(쉼표 구분). 비어 있으면(기본) 꺼짐.
      IANCAR_PHOTO_ID_GATE_SUPPLIERS: ${{ vars.FREEPASS_DATA_IANCAR_PHOTO_ID_GATE_SUPPLIERS }}
      REQUESTED_RUNTIME_SOURCE_SHA: ${{ inputs.runtime_source_sha }}
      EXPECTED_BASELINE_REVISION: ${{ inputs.expected_baseline_revision }}
      EXPECTED_BASELINE_SOURCE_SHA: ${{ inputs.expected_baseline_source_sha }}
      EXPECTED_BASELINE_IMAGE_DIGEST: ${{ inputs.expected_baseline_image_digest }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fail closed until bootstrap is complete
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ vars.FREEPASS_DATA_DEPLOY_WIF_PROVIDER }}'
          test -n '${{ vars.FREEPASS_DATA_DEPLOY_SERVICE_ACCOUNT }}'
          test -n "$REGION"
          test -n "$SERVICE_NAME"
          test -n "$ARTIFACT_REPOSITORY"
          test -n "$RUNTIME_SERVICE_ACCOUNT"
          [[ -z "${IANCAR_PHOTO_ID_GATE_SUPPLIERS:-}" || "${IANCAR_PHOTO_ID_GATE_SUPPLIERS:-}" =~ ^(RP[0-9]{3})(,RP[0-9]{3})*$ ]]
          if [ "$USE_CONSUMER_SECRETS" = "true" ]; then
            test -n "$CONSUMERS_SECRET_NAME"
            [[ "$CONSUMERS_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
            test "$IANCAR_SECRET_NAME" = 'freepass-data-iancar-one-api'
            [[ "$IANCAR_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
          fi
          test "$GITHUB_REF" = 'refs/heads/main'

      - name: Resolve trusted runtime source
        id: runtime-source
        shell: bash
        env:
          REQUESTED_RUNTIME_SOURCE_SHA: ${{ inputs.runtime_source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_sha="${REQUESTED_RUNTIME_SOURCE_SHA:-$GITHUB_SHA}"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          resolved="$(git rev-parse --verify "$source_sha^{commit}")"
          test "$resolved" = "$source_sha"
          git merge-base --is-ancestor "$resolved" "$GITHUB_SHA"
          if [ -n "${REQUESTED_RUNTIME_SOURCE_SHA:-}" ]; then
            [[ "${EXPECTED_BASELINE_REVISION:-}" =~ ^freepass-data-read-[0-9]{5}-[a-z0-9]+$ ]]
            [[ "${EXPECTED_BASELINE_SOURCE_SHA:-}" =~ ^[a-f0-9]{40}$ ]]
            [[ "${EXPECTED_BASELINE_IMAGE_DIGEST:-}" =~ ^sha256:[a-f0-9]{64}$ ]]
            test "$USE_CONSUMER_SECRETS" = 'true'
            test "$ALLOW_UNAUTHENTICATED" = 'false'
            test "$GRANT_PUBLIC_INVOKER" = 'false'
            test "$RUNTIME_ENTRYPOINT" = 'dist/src/api/consumer-server.js'
          fi
          echo "sha=$resolved" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_SOURCE_SHA=$resolved" >> "$GITHUB_ENV"
          echo "WORKFLOW_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          if [ "$resolved" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ]; then
            test "$EXPECTED_BASELINE_REVISION" = 'freepass-data-read-00035-n8q'
            test "$EXPECTED_BASELINE_SOURCE_SHA" = '57abb8a978457b87068c3c9c9d76cc8116934bd5'
            test "$EXPECTED_BASELINE_IMAGE_DIGEST" = 'sha256:e963c5436954d155119fa0d44a3bcc1c67b0cb38d4b996c886b18187d6f3cb42'
            test -z "${IANCAR_PHOTO_ID_GATE_SUPPLIERS:-}" || test "$IANCAR_PHOTO_ID_GATE_SUPPLIERS" = 'RP031'
            echo 'IANCAR_PHOTO_ID_GATE_SUPPLIERS=RP031' >> "$GITHUB_ENV"
          elif [ "$resolved" = 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' ]; then
            test "$EXPECTED_BASELINE_REVISION" = 'freepass-data-read-00038-phh'
            test "$EXPECTED_BASELINE_SOURCE_SHA" = 'c9b9a4b31d001c2cbffd43022c9213e01e3d2544'
            test "$EXPECTED_BASELINE_IMAGE_DIGEST" = 'sha256:6322eb95ab90882f42febd480844c45e400411ccc1a81c99f8601de3e2e6c5b2'
            test -z "${IANCAR_PHOTO_ID_GATE_SUPPLIERS:-}" || test "$IANCAR_PHOTO_ID_GATE_SUPPLIERS" = 'RP031'
            echo 'IANCAR_PHOTO_ID_GATE_SUPPLIERS=RP031' >> "$GITHUB_ENV"
          fi
          if [ "$resolved" = '8af86d3b84020a402e21ec3c34a8498bd3066148' ] || [ "$resolved" = '7a02e85475ffb4a3f1d417987403a3fa3e6b3be8' ] || [ "$resolved" = '2ebdb18822416847b2019f6506b7b0d65daf0ee2' ] || [ "$resolved" = '57abb8a978457b87068c3c9c9d76cc8116934bd5' ] || [ "$resolved" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ] || [ "$resolved" = 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' ]; then
            helper_file="$(mktemp "$RUNNER_TEMP/single-product-readback.XXXXXX.mjs")"
            git show "$GITHUB_SHA:scripts/verify-single-product-readback.mjs" > "$helper_file"
            echo "SINGLE_PRODUCT_HELPER_FILE=$helper_file" >> "$GITHUB_ENV"
            echo "SINGLE_PRODUCT_HELPER_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi

      - name: Validate public approval before deployment effects
        shell: bash
        env:
          APPROVED_PLAN_DIGEST: ${{ vars.FREEPASS_DATA_PUBLIC_RUNTIME_APPROVED_DIGEST }}
        run: |
          set -euo pipefail
          # No authentication, image publication or Cloud Run mutation precedes this gate.
          test "$ALLOW_UNAUTHENTICATED" = "$GRANT_PUBLIC_INVOKER"
          if [ "$GRANT_PUBLIC_INVOKER" = "true" ] || [ "$SERVICE_NAME" = "freepass-data-public" ] || [ "$RUNTIME_ENTRYPOINT" = "dist/src/api/public-server.js" ] || [ "$RUNTIME_SERVICE_ACCOUNT" = "freepass-data-public-runtime@freepasserp5.iam.gserviceaccount.com" ]; then
            test "$PROJECT_ID" = 'freepasserp5'
            test "$REGION" = 'asia-northeast3'
            test "$SERVICE_NAME" = 'freepass-data-public'
            test "$RUNTIME_SERVICE_ACCOUNT" = 'freepass-data-public-runtime@freepasserp5.iam.gserviceaccount.com'
            test "$RUNTIME_ENTRYPOINT" = 'dist/src/api/public-server.js'
            test "$USE_CONSUMER_SECRETS" = "false"
            test "$MAX_INSTANCES" = "4"
            test "$RUNTIME_CONCURRENCY" = "16"
            plan_digest="$(node scripts/public-runtime-plan-digest.mjs docs/PUBLIC-RUNTIME-PLAN.md \
              --service "$SERVICE_NAME" \
              --service-account "$RUNTIME_SERVICE_ACCOUNT" \
              --entrypoint "$RUNTIME_ENTRYPOINT" \
              --use-consumer-secrets "$USE_CONSUMER_SECRETS" \
              --max-instances "$MAX_INSTANCES" \
              --runtime-concurrency "$RUNTIME_CONCURRENCY")"
            test -n "$APPROVED_PLAN_DIGEST"
            test "$plan_digest" = "$APPROVED_PLAN_DIGEST"
            echo 'PUBLIC_RUNTIME_APPROVAL_VALIDATED=true' >> "$GITHUB_ENV"
          fi

      - name: Checkout resolved runtime source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.runtime-source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: ${{ env.EXPECTED_SOURCE_SHA == '57abb8a978457b87068c3c9c9d76cc8116934bd5' || env.EXPECTED_SOURCE_SHA == 'd42c4f58d939d7899457730cd1a82f419b3eade8' || env.EXPECTED_SOURCE_SHA == 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' }}
        with:
          node-version: 22

      - name: Validate selected photo source before publication
        if: ${{ env.EXPECTED_SOURCE_SHA == '57abb8a978457b87068c3c9c9d76cc8116934bd5' || env.EXPECTED_SOURCE_SHA == 'd42c4f58d939d7899457730cd1a82f419b3eade8' || env.EXPECTED_SOURCE_SHA == 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EXPECTED_SOURCE_SHA" in
            57abb8a978457b87068c3c9c9d76cc8116934bd5)
              expected_tree='712c286a842dea616e7360b421fdd5e068540a40'
              expected_parent='2ebdb18822416847b2019f6506b7b0d65daf0ee2' ;;
            d42c4f58d939d7899457730cd1a82f419b3eade8)
              expected_tree='4ea34735d2c5ebd4b0b369435e8f3dda81ace01b'
              expected_parent='1fa62d59151e25f78d900e27d496eb92f9f210bf'
              probe_file="$(mktemp "$RUNNER_TEMP/sharp-list-runtime.XXXXXX.mjs")"
              git show "$WORKFLOW_SOURCE_SHA:scripts/verify-photo-rendition-runtime.mjs" > "$probe_file"
              chmod 0444 "$probe_file" ;;
            bd03f33b9bdedfb8f49ad8717062b32784e9a08a)
              expected_tree='f8b0d22400bff1987ae9cf1824302c99afefce05'
              expected_parent='c9b9a4b31d001c2cbffd43022c9213e01e3d2544'
              probe_file="$(mktemp "$RUNNER_TEMP/sharp-list-runtime.XXXXXX.mjs")"
              git show "$WORKFLOW_SOURCE_SHA:scripts/verify-photo-rendition-runtime.mjs" > "$probe_file"
              chmod 0444 "$probe_file" ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$expected_tree"
          test "$(git show -s --format=%P HEAD)" = "$expected_parent"
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" "$WORKFLOW_SOURCE_SHA"
          source_dir="$(mktemp -d "$RUNNER_TEMP/photo-source.XXXXXX")"
          source_files="$(mktemp "$RUNNER_TEMP/photo-files.XXXXXX")"
          git ls-tree -r --name-only -z "$EXPECTED_SOURCE_SHA" > "$source_files"
          git -c core.autocrlf=false archive "$EXPECTED_SOURCE_SHA" | tar -x -C "$source_dir"
          cd "$source_dir"
          # Existing public-file checks require a Git index; no remotes or credentials.
          git init --quiet
          git -c core.autocrlf=false --literal-pathspecs add --force --pathspec-from-file="$source_files" --pathspec-file-nul
          git ls-files --cached -z | cmp - "$source_files"
          test "$(git write-tree)" = "$expected_tree"
          npm ci
          npm run check:arch
          npm run check:standards
          npm run check:data-access-boundary
          npm run check:sheets
          npm run build
          env -u IANCAR_PHOTO_ID_GATE_SUPPLIERS -u REQUESTED_RUNTIME_SOURCE_SHA npm test
          npm run test:read-runtime-smoke
          npm run test:shadow
          npm run test:delivery-owner
          if [ "$EXPECTED_SOURCE_SHA" = 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' ]; then
            npm exec -- vitest run tests/vehicle-photo-rendition.test.ts tests/vehicle-photo-size-gateway.test.ts tests/consumer-gateway.test.ts tests/iancar-photo-id-gate.test.ts tests/iancar-photo-id-gate-config.test.ts tests/iancar-photo-id-gate-http.test.ts tests/iancar-photo-runtime-preflight.test.ts tests/iancar-publication-withdrawal.test.ts tests/vehicle-photo-read-observer.test.ts tests/vehicle-photo-metadata-diagnostic.test.ts tests/iancar-one-api.test.ts
          elif [ "$EXPECTED_SOURCE_SHA" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ]; then
            npm exec -- vitest run tests/vehicle-photo-rendition.test.ts tests/vehicle-photo-size-gateway.test.ts tests/consumer-gateway.test.ts tests/iancar-photo-id-gate.test.ts tests/iancar-photo-id-gate-config.test.ts tests/iancar-photo-id-gate-http.test.ts tests/iancar-photo-runtime-preflight.test.ts tests/iancar-publication-withdrawal.test.ts tests/vehicle-photo-read-observer.test.ts tests/vehicle-photo-metadata-diagnostic.test.ts
          else
            npm exec -- vitest run tests/vehicle-photo-read-observer.test.ts tests/vehicle-photo-read-diagnostic.test.ts tests/iancar-publication-withdrawal.test.ts
          fi
          local_image="freepass-data-selected-check:$EXPECTED_SOURCE_SHA"
          docker build --pull --build-arg "FREEPASS_DATA_ENTRYPOINT=$RUNTIME_ENTRYPOINT" --build-arg "FREEPASS_DATA_SOURCE_SHA=$EXPECTED_SOURCE_SHA" --label "org.opencontainers.image.revision=$EXPECTED_SOURCE_SHA" --tag "$local_image" .
          test "$(docker image inspect "$local_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED_SOURCE_SHA"
          docker image inspect "$local_image" --format '{{json .Config.Env}}' | jq -e 'index("FREEPASS_DATA_ENTRYPOINT=dist/src/api/consumer-server.js") != null' >/dev/null
          if [ "$EXPECTED_SOURCE_SHA" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ] || [ "$EXPECTED_SOURCE_SHA" = 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' ]; then
            docker run --rm --network none --memory=512m --cpus=1 --entrypoint node --mount "type=bind,source=$probe_file,target=/tmp/sharp-list-runtime-probe.mjs,readonly" "$local_image" /tmp/sharp-list-runtime-probe.mjs
          fi
          echo "SELECTED_PHOTO_SOURCE_CHECKED=true" >> "$GITHUB_ENV"
          echo "Selected source/tree Linux checks and local image verified: $EXPECTED_SOURCE_SHA / $expected_tree" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate deploy identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FREEPASS_DATA_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.FREEPASS_DATA_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: '579.0.0'

      - name: Verify required APIs are already enabled
        shell: bash
        run: |
          set -euo pipefail
          echo "READ_RUNTIME_APIS_READY=false" >> "$GITHUB_ENV"
          enabled="$(gcloud services list --enabled --project="$PROJECT_ID" --format='value(config.name)')"
          for api in run.googleapis.com artifactregistry.googleapis.com iamcredentials.googleapis.com sts.googleapis.com secretmanager.googleapis.com; do
            grep -qx "$api" <<<"$enabled" || {
              echo "::error::Required API is not enabled: $api"
              exit 1
            }
          done
          echo "READ_RUNTIME_APIS_READY=true" >> "$GITHUB_ENV"

      - name: Verify photo consumer secret before enabling the photo ID gate
        # 게이트를 켜는 배포(변수 비어 있지 않음)는 소비처 비밀 확인이 통과해야만 다음 배포 단계로 간다. 변수가 비어 있으면(꺼짐) 건너뛴다.
        if: ${{ env.USE_CONSUMER_SECRETS == 'true' && env.IANCAR_PHOTO_ID_GATE_SUPPLIERS != '' }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          # 비밀 값이 로그에 남지 않게: 실행 추적을 끄고, 조회·검증 명령의 stdout·stderr 를 모두 버리며 실패 시 고정 문구만 출력한다.
          consumers_json="$(gcloud secrets versions access "$CONSUMERS_SECRET_VERSION" --project="$PROJECT_ID" --secret="$CONSUMERS_SECRET_NAME" 2>/dev/null)" || {
            echo '::error::소비처 비밀을 읽지 못했습니다(권한 또는 버전 확인 필요)'; exit 1; }
          trap 'unset consumers_json' EXIT
          # 사진 소비처(erp5-public-media)가 정확히 하나, photos 권한, 32자 이상 토큰 — 존재·권한·형식만 보고 값은 출력하지 않는다.
          jq -e '[.[] | select(.id == "erp5-public-media")] | length == 1 and (.[0].capabilities | type == "array" and index("photos") != null) and (.[0].token | type == "string" and length >= 32)' <<< "$consumers_json" >/dev/null 2>&1 || {
            echo '::error::소비처 비밀 형식 불일치(erp5-public-media 항목·photos 권한·토큰 형식 확인 필요)'; exit 1; }
          echo 'READ_RUNTIME_PHOTO_CONSUMER_SECRET_VERIFIED=true' >> "$GITHUB_ENV"

      - name: Build immutable container
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EXPECTED_SOURCE_SHA" = '57abb8a978457b87068c3c9c9d76cc8116934bd5' ] || [ "$EXPECTED_SOURCE_SHA" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ] || [ "$EXPECTED_SOURCE_SHA" = 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' ]; then
            test "${SELECTED_PHOTO_SOURCE_CHECKED:-false}" = 'true'
          fi
          registry="$REGION-docker.pkg.dev"
          # 진입점이 기본(소비자 서버)이 아니면 이미지 이름을 서비스 이름으로 분리한다 — 같은 SHA 태그를 재사용하다 다른 진입점 이미지가 배포되는 사고 방지.
          image_name="freepass-data-read"
          if [ "$RUNTIME_ENTRYPOINT" != "dist/src/api/consumer-server.js" ]; then image_name="$SERVICE_NAME"; fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          image="$registry/$PROJECT_ID/$ARTIFACT_REPOSITORY/$image_name:$EXPECTED_SOURCE_SHA"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          if gcloud artifacts docker images describe "$image" \
            --project="$PROJECT_ID" --format='value(image_summary.digest)' | grep -q '^sha256:'; then
            echo "Reusing existing immutable image for $EXPECTED_SOURCE_SHA"
          else
            gcloud auth configure-docker "$registry" --quiet
            docker build --pull --build-arg "FREEPASS_DATA_ENTRYPOINT=$RUNTIME_ENTRYPOINT" --build-arg "FREEPASS_DATA_SOURCE_SHA=$EXPECTED_SOURCE_SHA" --label "org.opencontainers.image.revision=$EXPECTED_SOURCE_SHA" --tag "$image" .
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED_SOURCE_SHA"
            docker push "$image"
          fi
          digest="$(gcloud artifacts docker images describe "$image" --project="$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          gcloud auth configure-docker "$registry" --quiet
          docker pull "$image@$digest"
          test "$(docker image inspect "$image@$digest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED_SOURCE_SHA"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$image@$digest" >> "$GITHUB_ENV"

      - name: Deploy private read-only service
        env:
          FREEPASS_SHEET_F04_ID: ${{ secrets.FREEPASS_SHEET_F04_ID }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_env="NODE_ENV=production,FREEPASS_DATA_DRIVER=firestore,FIREBASE_PROJECT_ID=freepasserp5"
          secret_args=()
          public_runtime_args=()
          if [ "$USE_CONSUMER_SECRETS" = "true" ]; then
            : "${FREEPASS_SHEET_F04_ID:?MISSING_SHEET_ID_ENV: FREEPASS_SHEET_F04_ID}"
            runtime_env="^@^NODE_ENV=production@FREEPASS_DATA_DRIVER=firestore@FIREBASE_PROJECT_ID=freepasserp5@FREEPASS_SHEET_F04_ID=$FREEPASS_SHEET_F04_ID"
            gate_env_exception=''
            if [ "$EXPECTED_SOURCE_SHA" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ]; then
              runtime_env="$runtime_env@IANCAR_PHOTO_ID_GATE_SUPPLIERS=RP031"
              gate_env_exception='IANCAR_PHOTO_ID_GATE_SUPPLIERS'
            fi
            public_runtime_args+=(--timeout=300s)
            # Existing private service only: keep binding values in this step's memory.
            before="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format=json)"
            if [ "$EXPECTED_SOURCE_SHA" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ] || [ "$EXPECTED_SOURCE_SHA" = 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' ]; then
              test "$IANCAR_PHOTO_ID_GATE_SUPPLIERS" = 'RP031'
              case "$EXPECTED_SOURCE_SHA" in
                d42c4f58d939d7899457730cd1a82f419b3eade8)
                  test "$EXPECTED_BASELINE_REVISION" = 'freepass-data-read-00035-n8q'
                  test "$EXPECTED_BASELINE_SOURCE_SHA" = '57abb8a978457b87068c3c9c9d76cc8116934bd5'
                  test "$EXPECTED_BASELINE_IMAGE_DIGEST" = 'sha256:e963c5436954d155119fa0d44a3bcc1c67b0cb38d4b996c886b18187d6f3cb42'
                  jq -e '[.spec.template.spec.containers[0].env[]? | select(.name == "IANCAR_PHOTO_ID_GATE_SUPPLIERS")] | length <= 1 and all(.[]; .valueFrom == null and .value == "RP031")' <<<"$before" >/dev/null ;;
                bd03f33b9bdedfb8f49ad8717062b32784e9a08a)
                  test "$EXPECTED_BASELINE_REVISION" = 'freepass-data-read-00038-phh'
                  test "$EXPECTED_BASELINE_SOURCE_SHA" = 'c9b9a4b31d001c2cbffd43022c9213e01e3d2544'
                  test "$EXPECTED_BASELINE_IMAGE_DIGEST" = 'sha256:6322eb95ab90882f42febd480844c45e400411ccc1a81c99f8601de3e2e6c5b2'
                  jq -e '[.spec.template.spec.containers[0].env[]? | select(.name == "IANCAR_PHOTO_ID_GATE_SUPPLIERS")] | length == 1 and all(.[]; .valueFrom == null and .value == "RP031")' <<<"$before" >/dev/null ;;
                *) exit 1 ;;
              esac
              rollback_gate_present="$(jq -r 'any(.spec.template.spec.containers[0].env[]?; .name == "IANCAR_PHOTO_ID_GATE_SUPPLIERS")' <<<"$before")"
              rollback_gate_value="$(jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "IANCAR_PHOTO_ID_GATE_SUPPLIERS") | .value' <<<"$before")"
              echo "ROLLBACK_PHOTO_ID_GATE_PRESENT=$rollback_gate_present" >> "$GITHUB_ENV"
              echo "ROLLBACK_PHOTO_ID_GATE_VALUE=$rollback_gate_value" >> "$GITHUB_ENV"
            fi
            if [ -n "${REQUESTED_RUNTIME_SOURCE_SHA:-}" ]; then
              test "$PROJECT_ID/$REGION/$SERVICE_NAME" = 'freepasserp5/asia-northeast3/freepass-data-read'
              test "$RUNTIME_SERVICE_ACCOUNT" = 'freepass-data-read-runtime@freepasserp5.iam.gserviceaccount.com'
              test "$MAX_INSTANCES/$RUNTIME_CONCURRENCY" = '10/8'
              test "$CONSUMERS_SECRET_NAME/$CONSUMERS_SECRET_VERSION/$IANCAR_SECRET_NAME/$IANCAR_SECRET_VERSION" = 'freepass-data-consumers/5/freepass-data-iancar-one-api/1'
              jq -e --arg revision "$EXPECTED_BASELINE_REVISION" --arg source "$EXPECTED_BASELINE_SOURCE_SHA" --arg digest "$EXPECTED_BASELINE_IMAGE_DIGEST" --arg account "$RUNTIME_SERVICE_ACCOUNT" '
                .status.latestReadyRevisionName == $revision and .status.latestCreatedRevisionName == $revision and
                (.status.conditions | any(.type == "Ready" and .status == "True")) and
                (.status.traffic | length == 1 and .[0].revisionName == $revision and .[0].percent == 100) and
                .status.url == "https://freepass-data-read-njl7veujva-du.a.run.app" and
                .spec.template.spec.serviceAccountName == $account and
                .spec.template.spec.timeoutSeconds == 300 and .spec.template.spec.containerConcurrency == 8 and
                .spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"] == "10" and
                (.spec | type == "object") and (.spec.template | type == "object") and (.spec.template.spec | type == "object") and
                (.spec.template.spec.containers | type == "array" and length == 1) and
                (.spec.template.spec | (has("volumes") | not) or (.volumes | type == "array" and length == 0)) and
                (.spec.template.spec.containers | all(.[]; type == "object" and ((has("volumeMounts") | not) or (.volumeMounts | type == "array" and length == 0)))) and
                ([.spec.template.spec.containers[0].env[]? | select(.name == "NODE_ENV" or .name == "FREEPASS_DATA_DRIVER" or .name == "FIREBASE_PROJECT_ID") | {name,value}] | sort_by(.name) == ([{name:"NODE_ENV",value:"production"},{name:"FREEPASS_DATA_DRIVER",value:"firestore"},{name:"FIREBASE_PROJECT_ID",value:"freepasserp5"}] | sort_by(.name))) and
                .spec.template.spec.containers[0].resources.limits.memory == "512Mi" and
                (.spec.template.spec.containers[0].ports | length == 1 and .[0].containerPort == 8080) and
                .spec.template.spec.containers[0].image == ("asia-northeast3-docker.pkg.dev/freepasserp5/freepass-data/freepass-data-read:" + $source + "@" + $digest)
              ' <<<"$before" >/dev/null
              echo 'READ_RUNTIME_BASELINE_VERIFIED=true' >> "$GITHUB_ENV"
            fi
            jq -e '.spec.template.spec.containers[0].env | any(.name == "FREEPASS_SHEET_F04_ID" and (.value | type == "string" and length > 0))' <<<"$before" >/dev/null
            existing_f04="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "FREEPASS_SHEET_F04_ID") | .value' <<<"$before")"
            test "$existing_f04" = "$FREEPASS_SHEET_F04_ID"
            expected_secrets="$(jq -cnS --arg consumers "$CONSUMERS_SECRET_NAME" --arg cv "$CONSUMERS_SECRET_VERSION" --arg one "$IANCAR_SECRET_NAME" --arg ov "$IANCAR_SECRET_VERSION" '[{name:"FREEPASS_DATA_CONSUMERS_JSON",valueFrom:{secretKeyRef:{name:$consumers,key:$cv}}},{name:"EANCAR_ONE_API_KEY",valueFrom:{secretKeyRef:{name:$one,key:$ov}}}] | sort_by(.name)')"
            existing_secrets="$(jq -cS '[.spec.template.spec.containers[0].env[]? | select(.valueFrom != null) | {name,valueFrom}] | sort_by(.name)' <<<"$before")"
            test "$existing_secrets" = "$expected_secrets"
            preserved_before="$(jq -cS --arg gate "$gate_env_exception" '[.spec.template.spec.containers[0].env[]? | select(.name != "NODE_ENV" and .name != "FREEPASS_DATA_DRIVER" and .name != "FIREBASE_PROJECT_ID" and .name != $gate) | {name,value,valueFrom}] | sort_by(.name)' <<<"$before")"
            secret_args+=(--set-secrets="FREEPASS_DATA_CONSUMERS_JSON=$CONSUMERS_SECRET_NAME:$CONSUMERS_SECRET_VERSION,EANCAR_ONE_API_KEY=$IANCAR_SECRET_NAME:$IANCAR_SECRET_VERSION")
          else
            public_runtime_args+=(--timeout=30s --cpu=1 --memory=512Mi)
          fi
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --platform=managed \
            --image="$IMAGE_REF" --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --ingress=all --max-instances="$MAX_INSTANCES" --concurrency="$RUNTIME_CONCURRENCY" --no-allow-unauthenticated \
            --update-env-vars="$runtime_env" \
            "${secret_args[@]}" "${public_runtime_args[@]}" --quiet
          if [ "$USE_CONSUMER_SECRETS" = "true" ]; then
            after="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format=json)"
            preserved_after="$(jq -cS --arg gate "$gate_env_exception" '[.spec.template.spec.containers[0].env[]? | select(.name != "NODE_ENV" and .name != "FREEPASS_DATA_DRIVER" and .name != "FIREBASE_PROJECT_ID" and .name != $gate) | {name,value,valueFrom}] | sort_by(.name)' <<<"$after")"
            test "$preserved_before" = "$preserved_after"
            if [ "$EXPECTED_SOURCE_SHA" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ] || [ "$EXPECTED_SOURCE_SHA" = 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' ]; then
              jq -e '[.spec.template.spec.containers[0].env[]? | select(.name == "IANCAR_PHOTO_ID_GATE_SUPPLIERS")] | length == 1 and all(.[]; .value == "RP031" and .valueFrom == null)' <<<"$after" >/dev/null
              echo 'READ_RUNTIME_PHOTO_ID_GATE_SUPPLIERS=RP031' >> "$GITHUB_ENV"
            fi
            jq -e '[.spec.template.spec.containers[0].env[]? | select(.name == "NODE_ENV" or .name == "FREEPASS_DATA_DRIVER" or .name == "FIREBASE_PROJECT_ID") | {name,value}] | sort_by(.name) == ([{name:"NODE_ENV",value:"production"},{name:"FREEPASS_DATA_DRIVER",value:"firestore"},{name:"FIREBASE_PROJECT_ID",value:"freepasserp5"}] | sort_by(.name))' <<<"$after" >/dev/null
            echo 'READ_RUNTIME_ENV_PRESERVED=true' >> "$GITHUB_ENV"
            unset before after preserved_before preserved_after existing_secrets expected_secrets existing_f04
          fi

      - name: Grant public invoker only when requested
        if: ${{ inputs.grant_public_invoker == true }}
        shell: bash
        env:
          APPROVED_PLAN_DIGEST: ${{ vars.FREEPASS_DATA_PUBLIC_RUNTIME_APPROVED_DIGEST }}
        run: |
          set -euo pipefail
          test "${PUBLIC_RUNTIME_APPROVAL_VALIDATED:-false}" = "true"
          test "$GRANT_PUBLIC_INVOKER" = "true"
          test "$ALLOW_UNAUTHENTICATED" = "true"
          # 승인 게이트: 개발 총괄이 승인한 계획 digest 를 저장소 변수에 넣어야만 allUsers 를 건다(계획서가 바뀌면 digest 가 달라져 막힌다).
          plan_digest="$(node scripts/public-runtime-plan-digest.mjs docs/PUBLIC-RUNTIME-PLAN.md \
            --service "$SERVICE_NAME" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --entrypoint "$RUNTIME_ENTRYPOINT" \
            --use-consumer-secrets "$USE_CONSUMER_SECRETS" \
            --max-instances "$MAX_INSTANCES" \
            --runtime-concurrency "$RUNTIME_CONCURRENCY")"
          test -n "$APPROVED_PLAN_DIGEST"
          test "$plan_digest" = "$APPROVED_PLAN_DIGEST"
          gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" \
            --member=allUsers --role=roles/run.invoker --quiet

      - name: Verify service readiness metadata
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json)"
          url="$(jq -r '.status.url // empty' <<<"$service_json")"
          ready="$(jq -r '[.status.conditions[] | select(.type == "Ready")][0].status // empty' <<<"$service_json")"
          revision="$(jq -r '.status.latestReadyRevisionName // empty' <<<"$service_json")"
          revision_service_account="$(jq -r '.spec.template.spec.serviceAccountName // empty' <<<"$service_json")"
          deployed_image="$(jq -r '.spec.template.spec.containers[0].image // empty' <<<"$service_json")"
          secret_version="$(jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "FREEPASS_DATA_CONSUMERS_JSON") | .valueFrom.secretKeyRef.key' <<<"$service_json")"
          latest_traffic="$(jq -r --arg revision "$revision" '[.status.traffic[] | select(.revisionName == $revision)] | (length == 1 and .[0].percent == 100)' <<<"$service_json")"
          test -n "$url"
          test "$ready" = "True"
          test -n "$revision"
          test "$revision_service_account" = "$RUNTIME_SERVICE_ACCOUNT"
          test "$deployed_image" = "$IMAGE_REF"
          test "${IMAGE##*:}" = "$EXPECTED_SOURCE_SHA"
          if [ "$USE_CONSUMER_SECRETS" = "true" ]; then
            test "$secret_version" = "$CONSUMERS_SECRET_VERSION"
            test "$(jq -r '.spec.template.spec.timeoutSeconds' <<<"$service_json")" = "300"
            test "$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "EANCAR_ONE_API_KEY") | .valueFrom.secretKeyRef.name' <<<"$service_json")" = "$IANCAR_SECRET_NAME"
            test "$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "EANCAR_ONE_API_KEY") | .valueFrom.secretKeyRef.key' <<<"$service_json")" = "$IANCAR_SECRET_VERSION"
          else
            test -z "$secret_version"
            test -z "$(jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "EANCAR_ONE_API_KEY") | .valueFrom.secretKeyRef.name' <<<"$service_json")"
          fi
          test "$(jq -r '.spec.template.spec.containerConcurrency' <<<"$service_json")" = "$RUNTIME_CONCURRENCY"
          test "$latest_traffic" = "true"
          policy="$(gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --format=json)"
          if [ "$ALLOW_UNAUTHENTICATED" = "true" ]; then
            test "$(jq -r '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]?] | sort | join(",")' <<<"$policy")" = "allUsers"
          else
            ! jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' <<<"$policy" >/dev/null
          fi
          echo "READ_RUNTIME_DEPLOYED_URL=$url" >> "$GITHUB_ENV"
          echo "READ_RUNTIME_READY=$ready" >> "$GITHUB_ENV"
          echo "READ_RUNTIME_REVISION=$revision" >> "$GITHUB_ENV"
          echo "READ_RUNTIME_IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo '## FreePass Data read runtime deployed'
            echo
            echo "Service: $SERVICE_NAME"
            echo "Region: $REGION"
            echo "URL: $url"
            echo "Image: $IMAGE"
            echo "Image digest: $IMAGE_DIGEST"
            echo "Revision: $revision"
            echo "Runtime source: $EXPECTED_SOURCE_SHA"
            echo "Workflow source: $WORKFLOW_SOURCE_SHA"
            echo
            echo 'Next: hand this URL to FreePassERP I-01, configure Vercel OIDC caller IAM, then switch ERP.com to OBSERVE.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate readback identity
        if: ${{ env.USE_CONSUMER_SECRETS == 'true' }}
        id: readback-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FREEPASS_DATA_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.FREEPASS_DATA_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.readiness.outputs.url }}

      - name: Verify IAM denial and authenticated compatibility readback
        if: ${{ env.USE_CONSUMER_SECRETS == 'true' }}
        env:
          CLOUD_RUN_ID_TOKEN: ${{ steps.readback-auth.outputs.id_token }}
        shell: bash
        run: |
          set -euo pipefail
          unauthenticated_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            "$READ_RUNTIME_DEPLOYED_URL/health")"
          test "$unauthenticated_status" = "403"
          echo "READ_RUNTIME_UNAUTHENTICATED_STATUS=$unauthenticated_status" >> "$GITHUB_ENV"

          cloud_run_token="$CLOUD_RUN_ID_TOKEN"
          consumers_json="$(gcloud secrets versions access "$CONSUMERS_SECRET_VERSION" \
            --project="$PROJECT_ID" \
            --secret="$CONSUMERS_SECRET_NAME")"
          consumer_token="$(jq -er '[.[] | select(.id == "erp-com")] | select(length == 1) | .[0].token' <<< "$consumers_json")"
          echo "::add-mask::$consumer_token"
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$response_file" "$headers_file" "${SINGLE_PRODUCT_HELPER_FILE:-}"; unset consumers_json consumer_token' EXIT
          authenticated_status="$(curl --silent --show-error --output "$response_file" \
            --dump-header "$headers_file" \
            --write-out '%{http_code}' \
            --header "X-Serverless-Authorization: Bearer $cloud_run_token" \
            --header "Authorization: Bearer $consumer_token" \
            "$READ_RUNTIME_DEPLOYED_URL/v1/consumers/erp-com/catalog-compat")"
          echo "READ_RUNTIME_AUTHENTICATED_STATUS=$authenticated_status" >> "$GITHUB_ENV"
          if [ "$authenticated_status" != "200" ]; then
            response_code="$(jq -r '.code // "NON_JSON_RESPONSE"' "$response_file" 2>/dev/null || echo NON_JSON_RESPONSE)"
            echo "::error::Authenticated compatibility readback failed: HTTP $authenticated_status / $response_code"
            exit 1
          fi
          if ! tr -d '\r' < "$headers_file" | grep -Eiq '^x-freepass-read-mode: DIRECT_FIRESTORE_REQUIRED$'; then
            echo '::error::Direct Firestore read mode header missing or invalid'
            exit 1
          fi
          if ! tr -d '\r' < "$headers_file" | grep -Eiq '^x-freepass-migration-status: LEGACY_READ_PENDING_RETIREMENT$'; then
            echo '::error::Legacy migration status header missing or invalid'
            exit 1
          fi
          echo "READ_RUNTIME_MIGRATION_SIGNAL_OK=true" >> "$GITHUB_ENV"
          jq -e '
            .schema == "freepass-data.catalog-compat/v1" and
            (.data.products | type == "object") and
            (.data.policies | type == "object") and
            (.data.partners | type == "object")
          ' "$response_file" >/dev/null
          echo "READ_RUNTIME_READBACK_OK=true" >> "$GITHUB_ENV"
          if [ "$EXPECTED_SOURCE_SHA" = '8af86d3b84020a402e21ec3c34a8498bd3066148' ] || [ "$EXPECTED_SOURCE_SHA" = '7a02e85475ffb4a3f1d417987403a3fa3e6b3be8' ] || [ "$EXPECTED_SOURCE_SHA" = '2ebdb18822416847b2019f6506b7b0d65daf0ee2' ] || [ "$EXPECTED_SOURCE_SHA" = '57abb8a978457b87068c3c9c9d76cc8116934bd5' ] || [ "$EXPECTED_SOURCE_SHA" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ] || [ "$EXPECTED_SOURCE_SHA" = 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' ]; then
            test "$SINGLE_PRODUCT_HELPER_SHA" = "$WORKFLOW_SOURCE_SHA"
            READBACK_CONSUMERS_JSON="$consumers_json" COMPAT_RESPONSE_FILE="$response_file" \
              node "$SINGLE_PRODUCT_HELPER_FILE" >> "$GITHUB_ENV"
          fi

      - name: Clean trusted readback helper
        if: always()
        shell: bash
        run: |
          rm -f "${SINGLE_PRODUCT_HELPER_FILE:-}"

      - name: Verify public runtime smoke
        if: ${{ env.USE_CONSUMER_SECRETS == 'false' && inputs.grant_public_invoker == true }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$READ_RUNTIME_DEPLOYED_URL/health")" = "200"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$READ_RUNTIME_DEPLOYED_URL/v1/consumers/erp-com/catalog")" = "404"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$READ_RUNTIME_DEPLOYED_URL/v1/admin")" = "404"

      - name: Record sanitized activation evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          HAS_DEPLOY_WIF_PROVIDER: ${{ vars.FREEPASS_DATA_DEPLOY_WIF_PROVIDER != '' }}
          HAS_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FREEPASS_DATA_DEPLOY_SERVICE_ACCOUNT != '' }}
          HAS_READ_REGION: ${{ vars.FREEPASS_DATA_READ_REGION != '' }}
          HAS_READ_SERVICE_NAME: ${{ vars.FREEPASS_DATA_READ_SERVICE_NAME != '' }}
          HAS_ARTIFACT_REPOSITORY: ${{ vars.FREEPASS_DATA_ARTIFACT_REPOSITORY != '' }}
          HAS_RUNTIME_SERVICE_ACCOUNT: ${{ vars.FREEPASS_DATA_RUNTIME_SERVICE_ACCOUNT != '' }}
          HAS_CONSUMERS_SECRET_NAME: ${{ vars.FREEPASS_DATA_CONSUMERS_SECRET_NAME != '' }}
        shell: bash
        run: |
          set +e
          missing_apis="unknown"
          if command -v gcloud >/dev/null 2>&1 && gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q .; then
            enabled="$(gcloud services list --enabled --project="$PROJECT_ID" --format='value(config.name)' 2>/dev/null)"
            missing=()
            for api in run.googleapis.com artifactregistry.googleapis.com iamcredentials.googleapis.com sts.googleapis.com secretmanager.googleapis.com; do
              grep -qx "$api" <<<"$enabled" || missing+=("$api")
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              missing_apis="none"
            else
              missing_apis="$(IFS=,; echo "${missing[*]}")"
            fi
          fi

          {
            echo '### ERP.com FreePass Data read runtime activation'
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- runtime source: \`${EXPECTED_SOURCE_SHA:-UNRESOLVED}\`"
            echo "- workflow source: \`$GITHUB_SHA\`"
            echo "- workflow status: **$JOB_STATUS**"
            echo "- deploy WIF provider configured: **$HAS_DEPLOY_WIF_PROVIDER**"
            echo "- deploy service account configured: **$HAS_DEPLOY_SERVICE_ACCOUNT**"
            echo "- region configured: **$HAS_READ_REGION**"
            echo "- service name configured: **$HAS_READ_SERVICE_NAME**"
            echo "- artifact repository configured: **$HAS_ARTIFACT_REPOSITORY**"
            echo "- runtime service account configured: **$HAS_RUNTIME_SERVICE_ACCOUNT**"
            echo "- consumer secret name configured: **$HAS_CONSUMERS_SECRET_NAME**"
            echo "- required APIs ready: **${READ_RUNTIME_APIS_READY:-false}**"
            echo "- missing APIs: **$missing_apis**"
            echo "- Cloud Run ready: **${READ_RUNTIME_READY:-false}**"
            echo "- unauthenticated request status: **${READ_RUNTIME_UNAUTHENTICATED_STATUS:-unknown}**"
            echo "- authenticated compatibility readback status: **${READ_RUNTIME_AUTHENTICATED_STATUS:-unknown}**"
            echo "- authenticated compatibility readback passed: **${READ_RUNTIME_READBACK_OK:-false}**"
            echo "- bounded single-product 200/401/403 readback passed: **${SINGLE_PRODUCT_READBACK_OK:-false}**"
            echo "- single-product diagnostic phase: **${SINGLE_PRODUCT_READBACK_PHASE:-NOT_RUN}**"
            echo "- single-product requests attempted: **${SINGLE_PRODUCT_READBACK_REQUEST_COUNT:-0}**"
            echo "- single-product last observed HTTP status: **${SINGLE_PRODUCT_READBACK_LAST_STATUS:-0}**"
            echo "- single-product safe diagnostic reason: **${SINGLE_PRODUCT_READBACK_REASON:-NONE}**"
            echo "- direct Firestore migration headers verified: **${READ_RUNTIME_MIGRATION_SIGNAL_OK:-false}**"
            if [ -n "${READ_RUNTIME_REVISION:-}" ]; then
              echo "- Cloud Run revision: \`${READ_RUNTIME_REVISION}\`"
            fi
            if [ -n "${READ_RUNTIME_IMAGE_DIGEST:-}" ]; then
              echo "- image digest: \`${READ_RUNTIME_IMAGE_DIGEST}\`"
            fi
            if [ -n "${READ_RUNTIME_DEPLOYED_URL:-}" ]; then
              echo "- Cloud Run URL: \`${READ_RUNTIME_DEPLOYED_URL}\`"
            fi
            echo
            echo 'No consumer token or credential value is recorded.'
          } > /tmp/read-runtime-evidence.md
          gh issue comment 209 --repo "$GITHUB_REPOSITORY" --body-file /tmp/read-runtime-evidence.md || true

  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: freepasserp5
      REGION: asia-northeast3
      SERVICE_NAME: freepass-data-read
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      EXPECTED_IMAGE_DIGEST: ${{ inputs.expected_image_digest }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.FREEPASS_DATA_RUNTIME_SERVICE_ACCOUNT }}
      CONSUMERS_SECRET_NAME: ${{ vars.FREEPASS_DATA_CONSUMERS_SECRET_NAME }}
      CONSUMERS_SECRET_VERSION: ${{ vars.FREEPASS_DATA_CONSUMERS_SECRET_VERSION }}
      EXPECTED_CONSUMERS_SECRET_VERSION: ${{ inputs.expected_consumers_secret_version || vars.FREEPASS_DATA_CONSUMERS_SECRET_VERSION }}
      IANCAR_SECRET_NAME: ${{ vars.FREEPASS_DATA_IANCAR_SECRET_NAME }}
      IANCAR_SECRET_VERSION: ${{ vars.FREEPASS_DATA_IANCAR_SECRET_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve trusted verification helper
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EXPECTED_SOURCE_SHA" = '8af86d3b84020a402e21ec3c34a8498bd3066148' ] || [ "$EXPECTED_SOURCE_SHA" = '7a02e85475ffb4a3f1d417987403a3fa3e6b3be8' ] || [ "$EXPECTED_SOURCE_SHA" = '2ebdb18822416847b2019f6506b7b0d65daf0ee2' ] || [ "$EXPECTED_SOURCE_SHA" = '57abb8a978457b87068c3c9c9d76cc8116934bd5' ] || [ "$EXPECTED_SOURCE_SHA" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ] || [ "$EXPECTED_SOURCE_SHA" = 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' ]; then
            test "$GITHUB_REF" = 'refs/heads/main'
            [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            helper_file="$(mktemp "$RUNNER_TEMP/single-product-readback.XXXXXX.mjs")"
            git show "$GITHUB_SHA:scripts/verify-single-product-readback.mjs" > "$helper_file"
            echo "SINGLE_PRODUCT_HELPER_FILE=$helper_file" >> "$GITHUB_ENV"
            echo "SINGLE_PRODUCT_HELPER_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "WORKFLOW_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      - name: Validate verification scope before authentication
        shell: bash
        env:
          VERIFY_PREFLIGHT_ONLY: 'true'
        run: bash scripts/verify-read-runtime.sh
      - name: Authenticate existing verification identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FREEPASS_DATA_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.FREEPASS_DATA_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: '579.0.0'
      - name: Verify existing service metadata without deployment
        id: readiness
        shell: bash
        run: bash scripts/verify-read-runtime.sh
      - name: Authenticate readback identity
        id: readback-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FREEPASS_DATA_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.FREEPASS_DATA_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.readiness.outputs.url }}

      - name: Verify IAM denial and authenticated compatibility readback
        env:
          CLOUD_RUN_ID_TOKEN: ${{ steps.readback-auth.outputs.id_token }}
        shell: bash
        run: |
          set -euo pipefail
          unauthenticated_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            "$READ_RUNTIME_DEPLOYED_URL/health")"
          test "$unauthenticated_status" = "403"
          echo "READ_RUNTIME_UNAUTHENTICATED_STATUS=$unauthenticated_status" >> "$GITHUB_ENV"

          cloud_run_token="$CLOUD_RUN_ID_TOKEN"
          consumers_json="$(gcloud secrets versions access "$CONSUMERS_SECRET_VERSION" \
            --project="$PROJECT_ID" \
            --secret="$CONSUMERS_SECRET_NAME")"
          consumer_token="$(jq -er '[.[] | select(.id == "erp-com")] | select(length == 1) | .[0].token' <<< "$consumers_json")"
          echo "::add-mask::$consumer_token"
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$response_file" "$headers_file" "${SINGLE_PRODUCT_HELPER_FILE:-}"; unset consumers_json consumer_token' EXIT
          authenticated_status="$(curl --silent --show-error --output "$response_file" \
            --dump-header "$headers_file" \
            --write-out '%{http_code}' \
            --header "X-Serverless-Authorization: Bearer $cloud_run_token" \
            --header "Authorization: Bearer $consumer_token" \
            "$READ_RUNTIME_DEPLOYED_URL/v1/consumers/erp-com/catalog-compat")"
          echo "READ_RUNTIME_AUTHENTICATED_STATUS=$authenticated_status" >> "$GITHUB_ENV"
          if [ "$authenticated_status" != "200" ]; then
            echo "::error::Authenticated compatibility readback failed: HTTP $authenticated_status / UNRECOGNIZED"
            exit 1
          fi
          if ! tr -d '\r' < "$headers_file" | grep -Eiq '^x-freepass-read-mode: DIRECT_FIRESTORE_REQUIRED$'; then
            echo '::error::Direct Firestore read mode header missing or invalid'
            exit 1
          fi
          if ! tr -d '\r' < "$headers_file" | grep -Eiq '^x-freepass-migration-status: LEGACY_READ_PENDING_RETIREMENT$'; then
            echo '::error::Legacy migration status header missing or invalid'
            exit 1
          fi
          echo "READ_RUNTIME_MIGRATION_SIGNAL_OK=true" >> "$GITHUB_ENV"
          jq -e '
            .schema == "freepass-data.catalog-compat/v1" and
            (.data.products | type == "object") and
            (.data.policies | type == "object") and
            (.data.partners | type == "object")
          ' "$response_file" >/dev/null
          echo "READ_RUNTIME_READBACK_OK=true" >> "$GITHUB_ENV"

          if [ "$EXPECTED_SOURCE_SHA" = '8af86d3b84020a402e21ec3c34a8498bd3066148' ] || [ "$EXPECTED_SOURCE_SHA" = '7a02e85475ffb4a3f1d417987403a3fa3e6b3be8' ] || [ "$EXPECTED_SOURCE_SHA" = '2ebdb18822416847b2019f6506b7b0d65daf0ee2' ] || [ "$EXPECTED_SOURCE_SHA" = '57abb8a978457b87068c3c9c9d76cc8116934bd5' ] || [ "$EXPECTED_SOURCE_SHA" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ] || [ "$EXPECTED_SOURCE_SHA" = 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' ]; then
            test "$SINGLE_PRODUCT_HELPER_SHA" = "$WORKFLOW_SOURCE_SHA"
            READBACK_CONSUMERS_JSON="$consumers_json" COMPAT_RESPONSE_FILE="$response_file" \
              node "$SINGLE_PRODUCT_HELPER_FILE" >> "$GITHUB_ENV"
          fi

      - name: Clean trusted verification helper
        if: always()
        shell: bash
        run: |
          rm -f "${SINGLE_PRODUCT_HELPER_FILE:-}"

      - name: Record verification summary
        if: always()
        env:
          VERIFY_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VERIFY_JOB_STATUS" = "success" ]; then
            test "${READ_RUNTIME_UNAUTHENTICATED_STATUS:-UNVERIFIED}" = "403"
            test "${READ_RUNTIME_AUTHENTICATED_STATUS:-UNVERIFIED}" = "200"
            test "${READ_RUNTIME_READBACK_OK:-false}" = "true"
            test "${READ_RUNTIME_MIGRATION_SIGNAL_OK:-false}" = "true"
            if [ "${EXPECTED_SOURCE_SHA:-}" = '8af86d3b84020a402e21ec3c34a8498bd3066148' ] || [ "${EXPECTED_SOURCE_SHA:-}" = '7a02e85475ffb4a3f1d417987403a3fa3e6b3be8' ] || [ "${EXPECTED_SOURCE_SHA:-}" = '2ebdb18822416847b2019f6506b7b0d65daf0ee2' ] || [ "${EXPECTED_SOURCE_SHA:-}" = '57abb8a978457b87068c3c9c9d76cc8116934bd5' ] || [ "${EXPECTED_SOURCE_SHA:-}" = 'd42c4f58d939d7899457730cd1a82f419b3eade8' ] || [ "${EXPECTED_SOURCE_SHA:-}" = 'bd03f33b9bdedfb8f49ad8717062b32784e9a08a' ]; then
              test "${SINGLE_PRODUCT_READBACK_OK:-false}" = "true"
            fi
          fi
          {
            echo '## Existing read runtime verification'
            echo "Verification job: $VERIFY_JOB_STATUS"
            echo "IAM denial: ${READ_RUNTIME_UNAUTHENTICATED_STATUS:-UNVERIFIED}"
            echo "Compatibility response: ${READ_RUNTIME_AUTHENTICATED_STATUS:-UNVERIFIED}"
            echo "Compatibility contract verified: ${READ_RUNTIME_READBACK_OK:-false}"
            echo "Migration headers verified: ${READ_RUNTIME_MIGRATION_SIGNAL_OK:-false}"
            echo "Single-product contract verified: ${SINGLE_PRODUCT_READBACK_OK:-false}"
            echo "Single-product diagnostic phase: ${SINGLE_PRODUCT_READBACK_PHASE:-NOT_RUN}"
            echo "Single-product requests attempted: ${SINGLE_PRODUCT_READBACK_REQUEST_COUNT:-0}"
            echo "Single-product last observed HTTP status: ${SINGLE_PRODUCT_READBACK_LAST_STATUS:-0}"
            echo "Single-product safe diagnostic reason: ${SINGLE_PRODUCT_READBACK_REASON:-NONE}"
            echo 'This run performed no deployment or IAM mutation.'
          } >> "$GITHUB_STEP_SUMMARY"
