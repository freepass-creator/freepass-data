name: Deploy FreePass Data read runtime

on:
  workflow_call:
    inputs:
      service_name:
        required: false
        type: string
      runtime_service_account:
        required: false
        type: string
      entrypoint:
        required: false
        type: string
        default: dist/src/api/consumer-server.js
      allow_unauthenticated:
        required: false
        type: boolean
        default: false
      grant_public_invoker:
        required: false
        type: boolean
        default: false
      max_instances:
        required: false
        type: number
        default: 10
      concurrency:
        required: false
        type: number
        default: 8
      use_consumer_secrets:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/read-runtime-deploy.trigger"

concurrency:
  group: freepass-data-read-runtime-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: freepasserp5
      REGION: ${{ vars.FREEPASS_DATA_READ_REGION }}
      SERVICE_NAME: ${{ inputs.service_name || vars.FREEPASS_DATA_READ_SERVICE_NAME }}
      ARTIFACT_REPOSITORY: ${{ vars.FREEPASS_DATA_ARTIFACT_REPOSITORY }}
      RUNTIME_SERVICE_ACCOUNT: ${{ inputs.runtime_service_account || vars.FREEPASS_DATA_RUNTIME_SERVICE_ACCOUNT }}
      RUNTIME_ENTRYPOINT: ${{ inputs.entrypoint || 'dist/src/api/consumer-server.js' }}
      ALLOW_UNAUTHENTICATED: ${{ inputs.allow_unauthenticated || false }}
      GRANT_PUBLIC_INVOKER: ${{ inputs.grant_public_invoker || false }}
      MAX_INSTANCES: ${{ inputs.max_instances || 10 }}
      RUNTIME_CONCURRENCY: ${{ inputs.concurrency || 8 }}
      USE_CONSUMER_SECRETS: ${{ inputs.use_consumer_secrets != false }}
      CONSUMERS_SECRET_NAME: ${{ vars.FREEPASS_DATA_CONSUMERS_SECRET_NAME }}
      CONSUMERS_SECRET_VERSION: ${{ vars.FREEPASS_DATA_CONSUMERS_SECRET_VERSION }}
      IANCAR_SECRET_NAME: ${{ vars.FREEPASS_DATA_IANCAR_SECRET_NAME }}
      IANCAR_SECRET_VERSION: ${{ vars.FREEPASS_DATA_IANCAR_SECRET_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Fail closed until bootstrap is complete
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ vars.FREEPASS_DATA_DEPLOY_WIF_PROVIDER }}'
          test -n '${{ vars.FREEPASS_DATA_DEPLOY_SERVICE_ACCOUNT }}'
          test -n "$REGION"
          test -n "$SERVICE_NAME"
          test -n "$ARTIFACT_REPOSITORY"
          test -n "$RUNTIME_SERVICE_ACCOUNT"
          if [ "$USE_CONSUMER_SECRETS" = "true" ]; then
            test -n "$CONSUMERS_SECRET_NAME"
            [[ "$CONSUMERS_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
            test "$IANCAR_SECRET_NAME" = 'freepass-data-iancar-one-api'
            [[ "$IANCAR_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
          fi
          test "$GITHUB_REF" = 'refs/heads/main'

      - name: Authenticate deploy identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FREEPASS_DATA_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.FREEPASS_DATA_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: '579.0.0'

      - name: Verify required APIs are already enabled
        shell: bash
        run: |
          set -euo pipefail
          echo "READ_RUNTIME_APIS_READY=false" >> "$GITHUB_ENV"
          enabled="$(gcloud services list --enabled --project="$PROJECT_ID" --format='value(config.name)')"
          for api in run.googleapis.com artifactregistry.googleapis.com iamcredentials.googleapis.com sts.googleapis.com secretmanager.googleapis.com; do
            grep -qx "$api" <<<"$enabled" || {
              echo "::error::Required API is not enabled: $api"
              exit 1
            }
          done
          echo "READ_RUNTIME_APIS_READY=true" >> "$GITHUB_ENV"

      - name: Build immutable container
        shell: bash
        run: |
          set -euo pipefail
          registry="$REGION-docker.pkg.dev"
          # 진입점이 기본(소비자 서버)이 아니면 이미지 이름을 서비스 이름으로 분리한다 — 같은 SHA 태그를 재사용하다 다른 진입점 이미지가 배포되는 사고 방지.
          image_name="freepass-data-read"
          if [ "$RUNTIME_ENTRYPOINT" != "dist/src/api/consumer-server.js" ]; then image_name="$SERVICE_NAME"; fi
          image="$registry/$PROJECT_ID/$ARTIFACT_REPOSITORY/$image_name:$GITHUB_SHA"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          if gcloud artifacts docker images describe "$image" \
            --project="$PROJECT_ID" --format='value(image_summary.digest)' | grep -q '^sha256:'; then
            echo "Reusing existing immutable image for $GITHUB_SHA"
          else
            gcloud auth configure-docker "$registry" --quiet
            docker build --pull --build-arg "FREEPASS_DATA_ENTRYPOINT=$RUNTIME_ENTRYPOINT" --tag "$image" .
            docker push "$image"
          fi
          digest="$(gcloud artifacts docker images describe "$image" --project="$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$image@$digest" >> "$GITHUB_ENV"

      - name: Deploy private read-only service
        env:
          FREEPASS_SHEET_F04_ID: ${{ secrets.FREEPASS_SHEET_F04_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FREEPASS_SHEET_F04_ID:?MISSING_SHEET_ID_ENV: FREEPASS_SHEET_F04_ID}"
          auth_flag='--no-allow-unauthenticated'
          if [ "$ALLOW_UNAUTHENTICATED" = "true" ]; then auth_flag='--allow-unauthenticated'; fi
          secret_args=()
          if [ "$USE_CONSUMER_SECRETS" = "true" ]; then
            secret_args+=(--set-secrets="FREEPASS_DATA_CONSUMERS_JSON=$CONSUMERS_SECRET_NAME:$CONSUMERS_SECRET_VERSION,EANCAR_ONE_API_KEY=$IANCAR_SECRET_NAME:$IANCAR_SECRET_VERSION")
          fi
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --platform=managed \
            --image="$IMAGE_REF" --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --ingress=all --max-instances="$MAX_INSTANCES" --concurrency="$RUNTIME_CONCURRENCY" "$auth_flag" \
            --set-env-vars="NODE_ENV=production,FREEPASS_DATA_DRIVER=firestore,FIREBASE_PROJECT_ID=freepasserp5,FREEPASS_SHEET_F04_ID=$FREEPASS_SHEET_F04_ID" \
            "${secret_args[@]}" --quiet

      - name: Grant public invoker only when requested
        if: ${{ inputs.grant_public_invoker == true }}
        shell: bash
        env:
          APPROVED_PLAN_DIGEST: ${{ vars.FREEPASS_DATA_PUBLIC_RUNTIME_APPROVED_DIGEST }}
        run: |
          set -euo pipefail
          test "$GRANT_PUBLIC_INVOKER" = "true"
          test "$ALLOW_UNAUTHENTICATED" = "true"
          # 승인 게이트: 개발 총괄이 승인한 계획 digest 를 저장소 변수에 넣어야만 allUsers 를 건다(계획서가 바뀌면 digest 가 달라져 막힌다).
          plan_digest="$(node scripts/public-runtime-plan-digest.mjs docs/PUBLIC-RUNTIME-PLAN.md)"
          test -n "$APPROVED_PLAN_DIGEST"
          test "$plan_digest" = "$APPROVED_PLAN_DIGEST"
          gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" \
            --member=allUsers --role=roles/run.invoker --quiet

      - name: Verify service readiness metadata
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json)"
          url="$(jq -r '.status.url // empty' <<<"$service_json")"
          ready="$(jq -r '[.status.conditions[] | select(.type == "Ready")][0].status // empty' <<<"$service_json")"
          revision="$(jq -r '.status.latestReadyRevisionName // empty' <<<"$service_json")"
          revision_service_account="$(jq -r '.spec.template.spec.serviceAccountName // empty' <<<"$service_json")"
          deployed_image="$(jq -r '.spec.template.spec.containers[0].image // empty' <<<"$service_json")"
          secret_version="$(jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "FREEPASS_DATA_CONSUMERS_JSON") | .valueFrom.secretKeyRef.key' <<<"$service_json")"
          latest_traffic="$(jq -r --arg revision "$revision" '[.status.traffic[] | select(.revisionName == $revision)] | (length == 1 and .[0].percent == 100)' <<<"$service_json")"
          test -n "$url"
          test "$ready" = "True"
          test -n "$revision"
          test "$revision_service_account" = "$RUNTIME_SERVICE_ACCOUNT"
          test "$deployed_image" = "$IMAGE_REF"
          if [ "$USE_CONSUMER_SECRETS" = "true" ]; then
            test "$secret_version" = "$CONSUMERS_SECRET_VERSION"
            test "$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "EANCAR_ONE_API_KEY") | .valueFrom.secretKeyRef.name' <<<"$service_json")" = "$IANCAR_SECRET_NAME"
            test "$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "EANCAR_ONE_API_KEY") | .valueFrom.secretKeyRef.key' <<<"$service_json")" = "$IANCAR_SECRET_VERSION"
          else
            test -z "$secret_version"
            test -z "$(jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "EANCAR_ONE_API_KEY") | .valueFrom.secretKeyRef.name' <<<"$service_json")"
          fi
          test "$(jq -r '.spec.template.spec.containerConcurrency' <<<"$service_json")" = "$RUNTIME_CONCURRENCY"
          test "$latest_traffic" = "true"
          policy="$(gcloud run services get-iam-policy "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --format=json)"
          if [ "$ALLOW_UNAUTHENTICATED" = "true" ]; then
            test "$(jq -r '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]?] | sort | join(",")' <<<"$policy")" = "allUsers"
          else
            ! jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers")' <<<"$policy" >/dev/null
          fi
          echo "READ_RUNTIME_DEPLOYED_URL=$url" >> "$GITHUB_ENV"
          echo "READ_RUNTIME_READY=$ready" >> "$GITHUB_ENV"
          echo "READ_RUNTIME_REVISION=$revision" >> "$GITHUB_ENV"
          echo "READ_RUNTIME_IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo '## FreePass Data read runtime deployed'
            echo
            echo "Service: $SERVICE_NAME"
            echo "Region: $REGION"
            echo "URL: $url"
            echo "Image: $IMAGE"
            echo "Image digest: $IMAGE_DIGEST"
            echo "Revision: $revision"
            echo
            echo 'Next: hand this URL to FreePassERP I-01, configure Vercel OIDC caller IAM, then switch ERP.com to OBSERVE.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate readback identity
        if: ${{ inputs.use_consumer_secrets != false }}
        id: readback-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.FREEPASS_DATA_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.FREEPASS_DATA_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.readiness.outputs.url }}

      - name: Verify IAM denial and authenticated compatibility readback
        if: ${{ inputs.use_consumer_secrets != false }}
        env:
          CLOUD_RUN_ID_TOKEN: ${{ steps.readback-auth.outputs.id_token }}
        shell: bash
        run: |
          set -euo pipefail
          unauthenticated_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            "$READ_RUNTIME_DEPLOYED_URL/health")"
          test "$unauthenticated_status" = "403"
          echo "READ_RUNTIME_UNAUTHENTICATED_STATUS=$unauthenticated_status" >> "$GITHUB_ENV"

          cloud_run_token="$CLOUD_RUN_ID_TOKEN"
          consumer_token="$(gcloud secrets versions access "$CONSUMERS_SECRET_VERSION" \
            --project="$PROJECT_ID" \
            --secret="$CONSUMERS_SECRET_NAME" \
            | jq -er '.[] | select(.id == "erp-com") | .token')"
          echo "::add-mask::$consumer_token"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          authenticated_status="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' \
            --header "X-Serverless-Authorization: Bearer $cloud_run_token" \
            --header "Authorization: Bearer $consumer_token" \
            "$READ_RUNTIME_DEPLOYED_URL/v1/consumers/erp-com/catalog-compat")"
          echo "READ_RUNTIME_AUTHENTICATED_STATUS=$authenticated_status" >> "$GITHUB_ENV"
          if [ "$authenticated_status" != "200" ]; then
            response_code="$(jq -r '.code // "NON_JSON_RESPONSE"' "$response_file" 2>/dev/null || echo NON_JSON_RESPONSE)"
            echo "::error::Authenticated compatibility readback failed: HTTP $authenticated_status / $response_code"
            exit 1
          fi
          jq -e '
            .schema == "freepass-data.catalog-compat/v1" and
            (.data.products | type == "object") and
            (.data.policies | type == "object") and
            (.data.partners | type == "object")
          ' "$response_file" >/dev/null
          echo "READ_RUNTIME_READBACK_OK=true" >> "$GITHUB_ENV"

      - name: Verify public runtime smoke
        if: ${{ inputs.use_consumer_secrets == false && inputs.grant_public_invoker == true }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$READ_RUNTIME_DEPLOYED_URL/health")" = "200"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$READ_RUNTIME_DEPLOYED_URL/v1/consumers/erp-com/catalog")" = "404"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$READ_RUNTIME_DEPLOYED_URL/v1/admin")" = "404"

      - name: Record sanitized activation evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          HAS_DEPLOY_WIF_PROVIDER: ${{ vars.FREEPASS_DATA_DEPLOY_WIF_PROVIDER != '' }}
          HAS_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FREEPASS_DATA_DEPLOY_SERVICE_ACCOUNT != '' }}
          HAS_READ_REGION: ${{ vars.FREEPASS_DATA_READ_REGION != '' }}
          HAS_READ_SERVICE_NAME: ${{ vars.FREEPASS_DATA_READ_SERVICE_NAME != '' }}
          HAS_ARTIFACT_REPOSITORY: ${{ vars.FREEPASS_DATA_ARTIFACT_REPOSITORY != '' }}
          HAS_RUNTIME_SERVICE_ACCOUNT: ${{ vars.FREEPASS_DATA_RUNTIME_SERVICE_ACCOUNT != '' }}
          HAS_CONSUMERS_SECRET_NAME: ${{ vars.FREEPASS_DATA_CONSUMERS_SECRET_NAME != '' }}
        shell: bash
        run: |
          set +e
          missing_apis="unknown"
          if command -v gcloud >/dev/null 2>&1 && gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q .; then
            enabled="$(gcloud services list --enabled --project="$PROJECT_ID" --format='value(config.name)' 2>/dev/null)"
            missing=()
            for api in run.googleapis.com artifactregistry.googleapis.com iamcredentials.googleapis.com sts.googleapis.com secretmanager.googleapis.com; do
              grep -qx "$api" <<<"$enabled" || missing+=("$api")
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              missing_apis="none"
            else
              missing_apis="$(IFS=,; echo "${missing[*]}")"
            fi
          fi

          {
            echo '### ERP.com FreePass Data read runtime activation'
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- workflow status: **$JOB_STATUS**"
            echo "- deploy WIF provider configured: **$HAS_DEPLOY_WIF_PROVIDER**"
            echo "- deploy service account configured: **$HAS_DEPLOY_SERVICE_ACCOUNT**"
            echo "- region configured: **$HAS_READ_REGION**"
            echo "- service name configured: **$HAS_READ_SERVICE_NAME**"
            echo "- artifact repository configured: **$HAS_ARTIFACT_REPOSITORY**"
            echo "- runtime service account configured: **$HAS_RUNTIME_SERVICE_ACCOUNT**"
            echo "- consumer secret name configured: **$HAS_CONSUMERS_SECRET_NAME**"
            echo "- required APIs ready: **${READ_RUNTIME_APIS_READY:-false}**"
            echo "- missing APIs: **$missing_apis**"
            echo "- Cloud Run ready: **${READ_RUNTIME_READY:-false}**"
            echo "- unauthenticated request status: **${READ_RUNTIME_UNAUTHENTICATED_STATUS:-unknown}**"
            echo "- authenticated compatibility readback status: **${READ_RUNTIME_AUTHENTICATED_STATUS:-unknown}**"
            echo "- authenticated compatibility readback passed: **${READ_RUNTIME_READBACK_OK:-false}**"
            if [ -n "${READ_RUNTIME_REVISION:-}" ]; then
              echo "- Cloud Run revision: \`${READ_RUNTIME_REVISION}\`"
            fi
            if [ -n "${READ_RUNTIME_IMAGE_DIGEST:-}" ]; then
              echo "- image digest: \`${READ_RUNTIME_IMAGE_DIGEST}\`"
            fi
            if [ -n "${READ_RUNTIME_DEPLOYED_URL:-}" ]; then
              echo "- Cloud Run URL: \`${READ_RUNTIME_DEPLOYED_URL}\`"
            fi
            echo
            echo 'No consumer token or credential value is recorded.'
          } > /tmp/read-runtime-evidence.md
          gh issue comment 209 --repo "$GITHUB_REPOSITORY" --body-file /tmp/read-runtime-evidence.md || true
