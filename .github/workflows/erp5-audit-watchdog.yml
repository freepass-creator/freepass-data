name: ERP5 audit watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

concurrency:
  group: erp5-audit-watchdog
  cancel-in-progress: false

# Reads only this repository's own Actions run history. It holds no Google Cloud
# identity on purpose: the WIF attribute condition admits the audit workflow path
# alone, so widening it for a second workflow would enlarge the token-minting
# surface without making the staleness signal any stronger.
permissions:
  contents: read
  actions: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ERP5_AUDIT_MAX_GAP_MINUTES: ${{ vars.ERP5_AUDIT_MAX_GAP_MINUTES }}
      AUDIT_WORKFLOW: erp5-continuous-audit.yml
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fail closed until the gap policy is configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ERP5_AUDIT_MAX_GAP_MINUTES"
          case "$ERP5_AUDIT_MAX_GAP_MINUTES" in
            *[!0-9]*|'') echo '::error::ERP5_AUDIT_MAX_GAP_MINUTES must be a positive integer'; exit 1 ;;
          esac
          test "$ERP5_AUDIT_MAX_GAP_MINUTES" -gt 0

      - name: Verify the last accepted audit run is recent
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          runs="$(mktemp)"
          # A successful audit run is proof the pointer advanced: that workflow only
          # reports success after its own byte readback and generation check pass.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$AUDIT_WORKFLOW/runs?branch=main&status=success&per_page=1" > "$runs"

          jq -e '(.total_count | type == "number") and (.workflow_runs | type == "array")' "$runs" >/dev/null
          if [ "$(jq -er '.workflow_runs | length' "$runs")" -eq 0 ]; then
            echo "::error::ERP5 audit watchdog found no successful $AUDIT_WORKFLOW run on main"
            exit 1
          fi

          jq -e '
            .workflow_runs[0].status == "completed" and
            .workflow_runs[0].conclusion == "success" and
            (.workflow_runs[0].id | type == "number") and
            (.workflow_runs[0].updated_at | type == "string" and length > 0)
          ' "$runs" >/dev/null

          run_id="$(jq -er '.workflow_runs[0].id' "$runs")"
          run_event="$(jq -er '.workflow_runs[0].event' "$runs")"
          run_sha="$(jq -er '.workflow_runs[0].head_sha' "$runs")"
          completed_at="$(jq -er '.workflow_runs[0].updated_at' "$runs")"

          now_epoch="$(date -u +%s)"
          run_epoch="$(date -u -d "$completed_at" +%s)"
          if [ "$run_epoch" -gt "$now_epoch" ]; then
            echo '::error::ERP5 last successful audit run completed in the future'
            exit 1
          fi

          age_seconds="$((now_epoch - run_epoch))"
          age_minutes="$(( (age_seconds + 59) / 60 ))"
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if [ "$age_minutes" -le "$ERP5_AUDIT_MAX_GAP_MINUTES" ]; then
            status='HEALTHY'
            reason='AUDIT_RUN_RECENT'
          else
            status='BLOCKED'
            reason='AUDIT_RUN_STALE'
          fi

          jq -n \
            --arg status "$status" \
            --arg reason "$reason" \
            --arg checkedAt "$checked_at" \
            --arg auditWorkflow "$AUDIT_WORKFLOW" \
            --arg lastSuccessfulRunCompletedAt "$completed_at" \
            --arg lastSuccessfulRunEvent "$run_event" \
            --arg lastSuccessfulRunSha "$run_sha" \
            --argjson lastSuccessfulRunId "$run_id" \
            --argjson ageMinutes "$age_minutes" \
            --argjson maxGapMinutes "$ERP5_AUDIT_MAX_GAP_MINUTES" \
            '{
              version: "erp5-audit-watchdog/2",
              evidenceSource: "GITHUB_ACTIONS_RUN_HISTORY",
              status: $status,
              reason: $reason,
              checkedAt: $checkedAt,
              auditWorkflow: $auditWorkflow,
              lastSuccessfulRunId: $lastSuccessfulRunId,
              lastSuccessfulRunEvent: $lastSuccessfulRunEvent,
              lastSuccessfulRunSha: $lastSuccessfulRunSha,
              lastSuccessfulRunCompletedAt: $lastSuccessfulRunCompletedAt,
              ageMinutes: $ageMinutes,
              maxGapMinutes: $maxGapMinutes,
              canonicalWriteAuthorized: false,
              destructiveActionAuthorized: false
            }' > audit-watchdog-summary.json

          jq -e '
            .version == "erp5-audit-watchdog/2" and
            (.status == "HEALTHY" or .status == "BLOCKED") and
            (.ageMinutes | type == "number" and . >= 0) and
            (.maxGapMinutes | type == "number" and . > 0) and
            .canonicalWriteAuthorized == false and
            .destructiveActionAuthorized == false
          ' audit-watchdog-summary.json >/dev/null

          {
            echo '## ERP5 audit watchdog'
            echo
            echo '| Evidence | Value |'
            echo '| --- | --- |'
            echo "| status | $(jq -r '.status' audit-watchdog-summary.json) |"
            echo "| reason | $(jq -r '.reason' audit-watchdog-summary.json) |"
            echo "| last successful run | $(jq -r '.lastSuccessfulRunId' audit-watchdog-summary.json) ($(jq -r '.lastSuccessfulRunEvent' audit-watchdog-summary.json)) |"
            echo "| completed at | $(jq -r '.lastSuccessfulRunCompletedAt' audit-watchdog-summary.json) |"
            echo "| age minutes | $(jq -r '.ageMinutes' audit-watchdog-summary.json) |"
            echo "| max gap minutes | $(jq -r '.maxGapMinutes' audit-watchdog-summary.json) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" = BLOCKED ]; then
            echo "::error::ERP5 audit has not succeeded recently: ${age_minutes}m > ${ERP5_AUDIT_MAX_GAP_MINUTES}m"
            exit 2
          fi

      - name: Retain watchdog summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp5-audit-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-watchdog-summary.json
          retention-days: 90
          if-no-files-found: warn
