name: Canon Guard (run)

# ai-ops 에서 생성한 파일 — 손으로 고치지 않는다. 복사본이 MANIFEST.json 과 다르면 첫 단계에서 실패한다.
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendored guard matches its manifest
        run: node .github/canon-guard/verify-manifest.mjs
      - name: Guard proves it still catches known-bad samples
        run: node .github/canon-guard/scripts/canon-guard.mjs --self-test
      - name: One canonical line per concern
        run: node .github/canon-guard/scripts/canon-guard.mjs --root .
      - name: Branch stays near main and does not contest a canonical path
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node .github/canon-guard/scripts/check-branch-discipline.mjs --root . --base "${{ github.base_ref }}"
